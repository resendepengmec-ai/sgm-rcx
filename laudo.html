<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laudo / Vistoria — SGM</title>
<script src="config.js"></script>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="api-client.js"></script>
<style>
  .laudo-wrap{ max-width:820px; margin:0 auto; padding:0 14px 40px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:14px; }
  .card-title{ font-weight:700; font-size:15px; margin-bottom:10px; }
  .scope-tabs{ display:flex; gap:8px; }
  .scope-tab{ flex:1; padding:12px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; text-align:center; font-weight:600; font-size:14px; }
  .scope-tab.active{ border-color:var(--primary); background:#eff6ff; color:var(--primary); }
  .equip-row{ display:flex; gap:8px; align-items:flex-start; background:var(--bg); border-radius:8px; padding:8px; margin-bottom:6px; }
  .foto-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .foto-thumb{ position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .foto-thumb img{ width:100%; height:100%; object-fit:cover; }
  .foto-del{ position:absolute; top:2px; right:2px; background:rgba(220,38,38,.9); color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px; line-height:1; }
  .foto-geo{ position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.6); color:#fff; font-size:8px; padding:1px 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn-lg{ width:100%; padding:13px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="app-header">
    <button onclick="location.href='index.html'" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">←</button>
    <div style="font-weight:700;font-size:17px">📋 Laudo de Vistoria</div>
    <div style="margin-left:auto;font-size:10px;color:rgba(255,255,255,.7)" id="l-build">v?</div>
  </div>

  <div class="laudo-wrap" id="root">
    <div style="text-align:center;color:var(--text-3);padding:40px">Carregando…</div>
  </div>

<script>
'use strict';
const LAUDO_BUILD='2026-08-22.1';
let prestadora = {};
let fotos = [];           // { dataUrl, geo, capturedAt }
let laudosCache = [];
let scope = 'equipamento';
let itensLaudo = [];   // equipamentos adicionados por TAG (escopo equipamento)
let _pdfData = null;   // dados do PDF em geração (form ou laudo salvo)
let currentLaudoId = null;   // id do laudo em edição (evita duplicar ao regerar)

function showToast(msg){
  let t=document.getElementById('_toast');
  if(!t){ t=document.createElement('div'); t.id='_toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:99999;opacity:0;transition:opacity .2s;max-width:90%;text-align:center'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

// API do laudo — INDEPENDENTE do api-client (não quebra se aquele estiver defasado)
const _SMM_URL = (typeof window.SMM_API!=='undefined') ? window.SMM_API : (localStorage.getItem('smm_api_url')||'');
async function laudoAPI(method, path, body){
  const token = sessionStorage.getItem('smm_jwt');
  let res;
  try{
    res = await fetch(`${_SMM_URL}/api${path}`, {
      method, headers:{'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{})},
      body: body?JSON.stringify(body):undefined
    });
  }catch(e){ throw new Error('Sem conexão com o servidor. Verifique a internet.'); }
  let json; try{ json = await res.json(); }catch(e){ throw new Error(`O servidor não respondeu corretamente (status ${res.status}).`); }
  if(!json.ok) throw new Error(json.error || `Erro ${res.status}`);
  return json.data;
}
const laudoSave  = l  => laudoAPI('POST','/laudos',{laudo:l});
const laudoList  = () => laudoAPI('GET','/laudos');
const laudoDel   = id => laudoAPI('DELETE',`/laudos/${id}`);
const laudoTexto = p  => laudoAPI('POST','/laudo/gerar-texto',p);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function contratos(){ try{ return JSON.parse(localStorage.getItem('smm_contracts')||'[]'); }catch(e){ return []; } }
function contratoSel(){ const el=document.getElementById('l-contract'); const n=el?el.value:''; return contratos().find(c=>String(c.numero)===String(n)) || null; }
function cidadeDoEndereco(end){
  if(!end) return '';
  let m = String(end).match(/([A-Za-zÀ-ÿ.\s]{3,}?)\s*[-\/]\s*[A-Z]{2}\b/);
  if(m) return m[1].trim();
  const parts = String(end).split(',').map(s=>s.trim()).filter(Boolean);
  return parts.length>=2 ? parts[parts.length-2] : (parts[0]||'');
}

(async function init(){
  const user = (typeof getCurrentUser==='function') ? getCurrentUser() : null;
  if(!user){ location.href='index.html'; return; }
  if(!['admin','diretor','supervisor','gestor'].includes(user.role)){
    document.getElementById('root').innerHTML='<div class="card">Este módulo é restrito a gestor ou acima.</div>'; return;
  }
  const bm=document.getElementById('l-build'); if(bm) bm.textContent='v'+LAUDO_BUILD;
  try{ prestadora = await DB.getPrestadoraConfig() || {}; }catch(e){ prestadora = {}; }
  try{ const cs = await DB.getContratos(); if(Array.isArray(cs)) localStorage.setItem('smm_contracts', JSON.stringify(cs)); }catch(e){}
  renderForm();
  renderItens();
  loadLaudos();
})();

function renderForm(){
  const opts = contratos().map(c=>`<option value="${esc(c.numero)}">${esc(c.numero)} — ${esc(c.razao||'')}</option>`).join('');
  document.getElementById('root').innerHTML = `
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="scope-tab active" id="vt-novo" onclick="switchView('novo')" style="flex:1">➕ Novo laudo</button>
      <button class="scope-tab" id="vt-real" onclick="switchView('realizados')" style="flex:1">✅ Realizados</button>
    </div>
    <div id="view-novo">
      <div class="card">
      <div class="card-title">Escopo do laudo</div>
      <div class="field"><label>Contrato *</label>
        <select id="l-contract" onchange="onContractChange()"><option value="">Selecione…</option>${opts}</select>
      </div>
      <div class="scope-tabs" style="margin:10px 0">
        <div class="scope-tab active" id="tab-equip" onclick="setScope('equipamento')">🔧 Equipamento(s)</div>
        <div class="scope-tab" id="tab-unidade" onclick="setScope('unidade')">🏢 Unidade inteira</div>
      </div>
      <div class="field" id="l-unidade-box" style="display:none"><label>Estabelecimento *</label>
        <select id="l-estab"><option value="">Selecione o contrato primeiro</option></select>
      </div>
      <div id="l-equip-scope">
        <div class="field"><label>TAG do equipamento</label>
          <div style="display:flex;gap:8px">
            <input id="l-tag" inputmode="numeric" placeholder="Ex: 892" style="flex:1"
              oninput="this.value=this.value.replace(/[^0-9]/g,'')"
              onkeydown="if(event.key==='Enter'){event.preventDefault();addTag();}">
            <button class="btn btn-secondary" onclick="addTag()" style="white-space:nowrap">+ Adicionar</button>
          </div>
          <div style="font-size:12px;color:var(--text-3);margin-top:4px">Digite só os números da TAG e Enter. Os dados do equipamento vêm do contrato.</div>
        </div>
        <div id="l-itens"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Problema</div>
      <div class="field"><label>Assunto *</label>
        <input id="l-assunto" placeholder="Ex: Solicitação de baixa de equipamento inviável">
      </div>
      <div class="field"><label>Palavras-chave do problema *</label>
        <textarea id="l-kw" rows="3" placeholder="Ex: deteriorado; fim de vida útil; sem peças de reposição; ruído excessivo"></textarea>
      </div>
      <button class="btn-lg" style="background:#0369a1;color:#fff" onclick="gerarTexto(this)">✨ Gerar texto técnico</button>
    </div>

    <div class="card">
      <div class="card-title">Texto do laudo (editável)</div>
      <textarea id="l-texto" rows="10" placeholder="O texto técnico gerado aparece aqui e pode ser editado antes de concluir…"></textarea>
    </div>

    <div class="card">
      <div class="card-title">Registro fotográfico</div>
      <input type="file" id="l-foto-input" accept="image/*" capture="environment" style="display:none" onchange="addFoto(event)">
      <button class="btn btn-secondary" onclick="document.getElementById('l-foto-input').click()" style="width:100%">📷 Adicionar foto</button>
      <div class="foto-grid" id="l-fotos"></div>
    </div>

    <div class="card">
      <div style="display:flex;gap:8px">
        <button class="btn-lg" style="background:#0369a1;color:#fff;flex:1" onclick="gerarLaudo(this)">🖨️ Gerar laudo</button>
        <button class="btn-lg" style="background:var(--surface);border:1px solid var(--border);color:var(--text);flex:0 0 auto" onclick="novoLaudo()">＋ Novo</button>
      </div>
    </div>

    <div id="view-realizados" style="display:none">
      <div class="card">
        <div class="card-title">Laudos realizados</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:150px;margin-bottom:8px"><label>Contrato</label>
            <select id="rf-contract" onchange="renderRealizados()"><option value="">Todos</option></select></div>
          <div class="field" style="flex:1;min-width:150px;margin-bottom:8px"><label>Estabelecimento</label>
            <select id="rf-estab" onchange="renderRealizados()"><option value="">Todos</option></select></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:120px;margin-bottom:8px"><label>De (mês)</label>
            <input id="rf-ini" type="month" onchange="renderRealizados()"></div>
          <div class="field" style="flex:1;min-width:120px;margin-bottom:8px"><label>Até (mês)</label>
            <input id="rf-fim" type="month" onchange="renderRealizados()"></div>
        </div>
        <div id="l-lista" style="margin-top:6px"><div style="color:var(--text-3);font-size:13px">Carregando…</div></div>
      </div>
    </div>
  `;
}

function setScope(s){
  scope = s;
  document.getElementById('tab-equip').classList.toggle('active', s==='equipamento');
  document.getElementById('tab-unidade').classList.toggle('active', s==='unidade');
  document.getElementById('l-unidade-box').style.display = (s==='unidade') ? '' : 'none';
  document.getElementById('l-equip-scope').style.display = (s==='equipamento') ? '' : 'none';
}
function equipsDoContrato(){
  const el = document.getElementById('l-contract'); const c = el?el.value:'';
  try{ return (getEffDB()[c]||[]).filter(e=>!e._inativo); }catch(e){ return []; }
}
function onContractChange(){
  const estabs = [...new Set(equipsDoContrato().map(e=>e.estabelecimento).filter(Boolean))].sort();
  document.getElementById('l-estab').innerHTML = '<option value="">Selecione…</option>' +
    estabs.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
  itensLaudo = []; renderItens();
}

// Escopo equipamento: adiciona por TAG (busca tudo no banco do contrato)
function addTag(){
  const inp = document.getElementById('l-tag');
  const tag = String(inp.value||'').replace(/\D/g,'');
  if(!document.getElementById('l-contract').value){ showToast('Selecione o contrato primeiro'); return; }
  if(!tag){ showToast('Digite a TAG'); return; }
  const norm = t => String(t||'').replace(/\D/g,'');
  const numEq = (a,b) => { const na=parseInt(norm(a),10), nb=parseInt(norm(b),10); return !isNaN(na)&&na===nb; };
  const eqs = equipsDoContrato();
  let found = eqs.find(e => norm(e.tag) === tag) || eqs.find(e => numEq(e.tag, tag));
  if(!found){ showToast(`TAG ${tag} não encontrada neste contrato`); return; }
  if(itensLaudo.some(x => numEq(x.tag, tag))){ showToast('TAG já adicionada'); inp.value=''; return; }
  itensLaudo.push(mapEq(found));
  inp.value=''; renderItens();
  showToast('Equipamento TAG '+(found.tag||tag)+' adicionado');
}
function removeItemLaudo(i){ itensLaudo.splice(i,1); renderItens(); }
function renderItens(){
  const box = document.getElementById('l-itens'); if(!box) return;
  if(!itensLaudo.length){ box.innerHTML = '<div style="font-size:12px;color:var(--text-3)">Nenhum equipamento adicionado.</div>'; return; }
  box.innerHTML = itensLaudo.map((e,i)=>`
    <div class="equip-row">
      <div style="flex:1;min-width:0;font-size:13px">
        <strong>TAG ${esc(e.tag||'—')}</strong>${e.patrimonio?' · Patr. '+esc(e.patrimonio):''}
        <br><span style="color:var(--text-2)">${esc([e.marca,e.tipo,e.capacidade].filter(Boolean).join(' · '))||'—'}${e.estabelecimento?' · '+esc(e.estabelecimento):''}${e.recinto?' · '+esc(e.recinto):''}</span>
      </div>
      <button onclick="removeItemLaudo(${i})" style="border:none;background:none;cursor:pointer;font-size:16px" title="Remover">🗑️</button>
    </div>`).join('');
}
function itensSelecionados(){
  if(scope==='unidade'){
    const estab = document.getElementById('l-estab').value;
    return equipsDoContrato().filter(e=>e.estabelecimento===estab).map(mapEq);
  }
  return itensLaudo.slice();
}
function mapEq(e){ return e ? { patrimonio:e.patrimonio||'', tag:e.tag||'', marca:e.marca||'', tipo:e.tipo||'', capacidade:e.capacidade||'', recinto:e.recinto||'', estabelecimento:e.estabelecimento||'' } : null; }

async function gerarTexto(btn){
  const kw = document.getElementById('l-kw').value.trim();
  if(!kw){ showToast('Informe as palavras-chave'); return; }
  const estab = document.getElementById('l-estab').value;
  const payload = {
    assunto: document.getElementById('l-assunto').value.trim(),
    escopo: scope, unidade: estab,
    itens: itensSelecionados().filter(Boolean),
    palavrasChave: kw,
  };
  const txt0 = btn.textContent; btn.disabled=true; btn.textContent='Gerando…';
  try{
    const res = await laudoTexto(payload);
    document.getElementById('l-texto').value = res.texto || '';
    showToast(res.fonte==='ia' ? 'Texto gerado por IA' : 'Texto gerado (modelo)');
  }catch(e){ showToast('Erro ao gerar: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent=txt0; }
}

function addFoto(ev){
  const file = ev.target.files && ev.target.files[0]; ev.target.value='';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const foto = { dataUrl: reader.result, geo: null, capturedAt: Date.now() };
    fotos.push(foto); renderFotos();
    showToast('Foto adicionada'+(navigator.geolocation?' — localizando…':''));
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async pos=>{
        foto.geo = { lat:pos.coords.latitude, lng:pos.coords.longitude, precisao:pos.coords.accuracy };
        try{
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${foto.geo.lat}&lon=${foto.geo.lng}&zoom=18&addressdetails=1`, {headers:{'Accept-Language':'pt-BR'}});
          if(r.ok){ const j = await r.json(); const a=j.address||{};
            const rua=a.road||a.pedestrian||'', numero=a.house_number?', '+a.house_number:'', bairro=a.suburb||a.neighbourhood||a.city_district||'', cidade=a.city||a.town||a.municipality||'', uf=a.state_code||(a.state?a.state.slice(0,2).toUpperCase():'');
            foto.geo.shortAddress = [rua?rua+numero:'', bairro, [cidade,uf].filter(Boolean).join('-')].filter(Boolean).join(', ') || null;
            foto.geo.address = j.display_name || foto.geo.shortAddress;
          }
        }catch(e){}
        renderFotos();
        if(foto.geo && foto.geo.shortAddress) showToast('Localização capturada');
      }, ()=>{}, {enableHighAccuracy:false, timeout:8000, maximumAge:0});
    }
  };
  reader.readAsDataURL(file);
}
function renderFotos(){
  document.getElementById('l-fotos').innerHTML = fotos.map((f,i)=>`
    <div class="foto-thumb">
      <img src="${f.dataUrl}">
      <button class="foto-del" onclick="fotos.splice(${i},1);renderFotos()">×</button>
      ${f.geo?`<a href="https://maps.google.com/?q=${f.geo.lat},${f.geo.lng}" target="_blank" onclick="event.stopPropagation()" title="${esc(f.geo.shortAddress||f.geo.address||'')}" style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;text-decoration:none;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 ${esc(f.geo.shortAddress ? f.geo.shortAddress.split(',')[0] : 'mapa')}</a>`:''}
    </div>`).join('');
}

function unidadeDoLaudo(){
  if(scope==='unidade') return document.getElementById('l-estab').value || '';
  // escopo equipamento: deriva dos estabelecimentos das TAGs adicionadas
  const ests = [...new Set(itensLaudo.map(e=>e.estabelecimento).filter(Boolean))];
  return ests.join(' / ');
}
function coletar(){
  const c = contratoSel();
  return {
    id: currentLaudoId || undefined,
    contract: c ? c.numero : (document.getElementById('l-contract').value||''),
    contratante: c ? (c.razao||'') : '',
    art: c ? (c.art||'') : '',
    cidade: c ? cidadeDoEndereco(c.end) : '',
    respTec: c ? (c.respTec||'') : '',
    crea: c ? (c.crea||'') : '',
    unidade: unidadeDoLaudo(),
    escopo: scope,
    assunto: document.getElementById('l-assunto').value.trim(),
    palavrasChave: document.getElementById('l-kw').value.trim(),
    texto: document.getElementById('l-texto').value.trim(),
    itens: itensSelecionados().filter(Boolean),
    photos: fotos,
  };
}

const PDF_M = 20, PDF_W = 210, PDF_H = 297;
function pdfHeader(doc){
  let y = 14, textX = PDF_M;
  if(prestadora.logo){
    const maxW=24, maxH=20; let w=maxW, h=prestadora.logoRatio?maxW*parseFloat(prestadora.logoRatio):maxW*0.6;
    if(h>maxH){ w=w*(maxH/h); h=maxH; }
    try{ doc.addImage(prestadora.logo,'PNG',PDF_M,y-2,w,h); textX=PDF_M+w+6; }catch(e){}
  }
  const d = _pdfData || coletar();
  const rightW=52, maxTextW=PDF_W-PDF_M-textX-rightW;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,20,20);
  const nameLines = doc.splitTextToSize(prestadora.company||'Empresa prestadora', maxTextW);
  doc.text(nameLines, textX, y+2);
  let ly = y+2 + nameLines.length*4.5 + 2.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,90,90);
  if(prestadora.address){ const a=doc.splitTextToSize(prestadora.address,maxTextW); doc.text(a,textX,ly); ly+=a.length*4; }
  if(prestadora.cnpj){ doc.text(`CNPJ: ${prestadora.cnpj}`, textX, ly); ly+=4; }
  doc.setTextColor(20,20,20); doc.setFontSize(9);
  doc.text('Contrato:', PDF_W-PDF_M, 14, {align:'right'});
  doc.text(String(d.contract||'—'), PDF_W-PDF_M, 19, {align:'right'});
  doc.setTextColor(0,0,0);
  const ruleY = Math.max(ly, 24)+3;
  doc.setDrawColor(180,180,180); doc.setLineWidth(0.5); doc.line(PDF_M, ruleY, PDF_W-PDF_M, ruleY); doc.setLineWidth(0.2);
  return ruleY+8;
}
function pdfFooters(doc){
  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i);
    doc.setDrawColor(200,200,200); doc.line(PDF_M, PDF_H-16, PDF_W-PDF_M, PDF_H-16);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130);
    doc.text(`Página ${i} de ${n}`, PDF_W-PDF_M, PDF_H-11, {align:'right'});
    doc.setTextColor(0,0,0);
  }
}
function ensure(doc, yObj, need){
  if(yObj.y + need > PDF_H-22){ doc.addPage(); yObj.y = pdfHeader(doc); }
}
function gerarPDF(d){
  if(!window.jspdf){ showToast('Biblioteca de PDF não carregou.'); return; }
  d = d || coletar();
  if(!d.contract){ showToast('Selecione o contrato'); return; }
  if(d.escopo==='equipamento' && !(d.itens||[]).length){ showToast('Adicione ao menos uma TAG'); return; }
  if(d.escopo==='unidade' && !d.unidade){ showToast('Selecione o estabelecimento'); return; }
  _pdfData = d;
  if(!d.texto){ showToast('Gere/edite o texto do laudo'); return; }
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'mm',format:'a4'});
  const yO = { y: pdfHeader(doc) };
  const CW = PDF_W-2*PDF_M;

  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(0,0,0);
  doc.text('RELATÓRIO DE VISTORIA', PDF_W/2, yO.y, {align:'center'}); yO.y+=9;

  const campo = (rot, val) => { doc.setFont('helvetica','bold'); doc.setFontSize(11);
    const lab = rot+': '; const lw = doc.getTextWidth(lab);
    doc.text(lab, PDF_M, yO.y); doc.setFont('helvetica','normal');
    const vl = doc.splitTextToSize(String(val||'—'), CW-lw); doc.text(vl, PDF_M+lw, yO.y);
    yO.y += Math.max(1,vl.length)*5 + 1.5; };
  campo('Unidade', d.unidade);
  campo('Contrato', d.contratante ? `${d.contratante} — nº ${d.contract}` : d.contract);
  campo('A/C', 'Gestor do contrato');
  campo('Assunto', d.assunto || '—');
  yO.y += 3;

  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  d.texto.split(/\n+/).forEach(par=>{
    const lines = doc.splitTextToSize(par.trim(), CW);
    ensure(doc, yO, lines.length*5+4);
    doc.text(lines, PDF_M, yO.y, {align:'justify', maxWidth:CW}); yO.y += lines.length*5 + 3;
  });
  yO.y += 2;

  if(d.itens && d.itens.length){
    ensure(doc, yO, 20);
    if(d.itens.length===1 && d.escopo==='equipamento'){
      const e=d.itens[0];
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Equipamento vistoriado', PDF_M, yO.y); yO.y+=6;
      doc.setFont('helvetica','normal');
      [['Marca',e.marca],['Tipo',e.tipo],['Capacidade',e.capacidade],['TAG',e.tag],['Patrimônio',e.patrimonio],['Recinto',e.recinto]]
        .filter(x=>x[1]).forEach(x=>{ ensure(doc,yO,6); doc.text(`${x[0]}: ${x[1]}`, PDF_M, yO.y); yO.y+=5; });
      yO.y+=3;
    } else {
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Equipamentos', PDF_M, yO.y); yO.y+=6;
      const cols=[['Patrimônio',24],['TAG',20],['Marca',34],['Capacidade',34],['Local',CW-24-20-34-34]];
      let x=PDF_M; doc.setFontSize(9); doc.setFillColor(240,240,240); doc.rect(PDF_M,yO.y-4,CW,7,'F');
      doc.setFont('helvetica','bold'); cols.forEach(c=>{ doc.text(c[0], x+1, yO.y); x+=c[1]; }); yO.y+=5;
      doc.setFont('helvetica','normal');
      d.itens.forEach(e=>{ ensure(doc,yO,7); x=PDF_M;
        const cells=[e.patrimonio||'—', e.tag||'—', e.marca||'—', e.capacidade||'—', e.recinto||e.estabelecimento||'—'];
        cells.forEach((cell,ci)=>{ const t=doc.splitTextToSize(String(cell), cols[ci][1]-2); doc.text(t[0]||'—', x+1, yO.y); x+=cols[ci][1]; });
        doc.setDrawColor(230,230,230); doc.line(PDF_M, yO.y+1.5, PDF_W-PDF_M, yO.y+1.5); yO.y+=6;
      });
      yO.y+=3;
    }
  }

  const validas = (d.photos||[]).filter(f=>f.dataUrl);
  if(validas.length){
    ensure(doc, yO, 20);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(`Registro fotográfico (${validas.length})`, PDF_M, yO.y); yO.y+=6;
    const cols=3, gap=6, cellW=(CW-gap*(cols-1))/cols;
    for(let i=0;i<validas.length;i+=cols){
      const row=validas.slice(i,i+cols); let hMax=0;
      const sized=row.map(f=>{ let w=cellW,h=cellW*0.75; try{ const p=doc.getImageProperties(f.dataUrl); h=cellW*(p.height/p.width); if(h>70){h=70;w=70*(p.width/p.height);} }catch(e){} hMax=Math.max(hMax,h); return {f,w,h}; });
      ensure(doc, yO, hMax+10);
      sized.forEach((it,c)=>{ const cx=PDF_M+c*(cellW+gap)+(cellW-it.w)/2;
        try{ doc.addImage(it.f.dataUrl,'JPEG',cx,yO.y,it.w,it.h); }catch(e){}
        if(it.f.geo){ doc.setFontSize(6); doc.setTextColor(37,99,235);
          const lb=it.f.geo.shortAddress||`${it.f.geo.lat.toFixed(5)}, ${it.f.geo.lng.toFixed(5)}`;
          doc.textWithLink(doc.splitTextToSize(lb, cellW)[0], PDF_M+c*(cellW+gap), yO.y+hMax+3, {url:`https://maps.google.com/?q=${it.f.geo.lat},${it.f.geo.lng}`});
          doc.setTextColor(0,0,0); doc.setFontSize(11); }
      });
      yO.y += hMax + 8;
    }
  }

  ensure(doc, yO, 46);
  yO.y += 4;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Estamos à disposição para eventuais dúvidas e questionamentos.', PDF_M, yO.y); yO.y+=10;
  const dataStr = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});
  doc.setFontSize(10);
  doc.text(`${d.cidade||''}${d.cidade?', ':''}${dataStr}.`, PDF_M, yO.y); yO.y+=22;
  doc.setDrawColor(60,60,60); doc.line(PDF_M, yO.y, PDF_M+80, yO.y); yO.y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  if(d.respTec){ doc.text(`Resp. Técnico: ${d.respTec}`, PDF_M, yO.y); yO.y+=5; }
  if(d.crea){ doc.text(String(d.crea), PDF_M, yO.y); yO.y+=5; }
  if(d.assinatura && d.assinatura.hash){
    yO.y += 4; doc.setFontSize(8); doc.setTextColor(120,120,120);
    const at = d.assinatura.at ? new Date(d.assinatura.at).toLocaleString('pt-BR') : '';
    doc.text(`Documento assinado digitalmente · HMAC ${String(d.assinatura.hash).slice(0,8)} [${d.assinatura.keyId||'legacy'}]${at?' · '+at:''}`, PDF_M, yO.y);
    doc.setTextColor(0,0,0); doc.setFontSize(10);
  }

  pdfFooters(doc);
  const nome = `laudo-${(d.unidade||'vistoria').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,30)}-${new Date().toISOString().slice(0,10)}.pdf`;
  try{ doc.save(nome); }catch(e){ showToast('Erro ao gerar PDF'); }
}

// Fluxo único: valida → salva no acervo (com assinatura HMAC) → gera o PDF → avisa → limpa a tela
async function gerarLaudo(btn){
  const d = coletar();
  if(!d.contract){ showToast('Selecione o contrato'); return; }
  if(scope==='equipamento' && !(d.itens||[]).length){ showToast('Adicione ao menos uma TAG'); return; }
  if(scope==='unidade' && !d.unidade){ showToast('Selecione o estabelecimento'); return; }
  if(!d.texto){ showToast('Gere o texto técnico antes de gerar o laudo'); return; }
  const t0 = btn ? btn.textContent : ''; if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  showToast('Salvando no acervo…');
  try{
    const saved = await laudoSave(d);      // persiste no servidor e retorna com assinatura HMAC
    // id garantido (mesmo que o backend não devolva), para a entrada nunca se perder
    const rec = { ...d, ...saved };
    if(!rec.id) rec.id = 'local-'+Date.now();
    if(!rec.createdAt) rec.createdAt = Date.now();
    // OTIMISTA: o laudo já entra no acervo a partir do retorno do POST
    laudosCache = [rec, ...laudosCache.filter(x=>x.id!==rec.id)];
    gerarPDF(rec);                          // gera e baixa o PDF (com a assinatura HMAC)
    novoLaudo(true);                        // limpa o formulário
    switchView('realizados');               // MOSTRA o acervo já com o laudo no topo
    showToast('Salvo no acervo ✓ ('+laudosCache.length+' no acervo)');
    // reconcilia com o servidor em segundo plano — MESCLA (nunca remove o que acabou de salvar)
    loadLaudos(true).then(()=>{
      if(saved && saved.id && !laudosCache.some(x=>x.id===saved.id)){
        showToast('Atenção: o servidor não retornou o laudo salvo — verifique o deploy do backend.');
      }
    }).catch(()=>{});
  }catch(e){
    showToast('Falha ao salvar: '+(e.message||e));
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=t0; }
  }
}
async function loadLaudos(merge){
  let list;
  try{ list = await laudoList(); }
  catch(e){
    if(!laudosCache.length){ const el=document.getElementById('l-lista'); if(el) el.innerHTML='<div style="color:#dc2626;font-size:13px;padding:8px 0">Não foi possível carregar do servidor: '+esc(e.message||e)+'. Atualize a página (Ctrl+Shift+R).</div>'; }
    else { populateRealFilters(); renderRealizados(); }
    return;
  }
  const server = Array.isArray(list) ? list : [];
  if(merge){
    const ids = new Set(server.map(x=>x.id));
    const locais = laudosCache.filter(x=>!ids.has(x.id));   // mantém o que o servidor ainda não devolveu
    laudosCache = [...locais, ...server];
  } else {
    laudosCache = server;
  }
  populateRealFilters();
  renderRealizados();
}
function novoLaudo(silent){
  currentLaudoId = null; _pdfData = null;
  const cs=document.getElementById('l-contract'); if(cs) cs.value=''; onContractChange();
  setScope('equipamento');
  itensLaudo = []; renderItens();
  ['l-estab','l-assunto','l-kw','l-texto','l-tag'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  fotos = []; renderFotos();
  window.scrollTo({top:0,behavior:'smooth'});
  if(!silent) showToast('Novo laudo — formulário limpo');
}

function switchView(v){
  document.getElementById('view-novo').style.display = v==='novo'?'':'none';
  document.getElementById('view-realizados').style.display = v==='realizados'?'':'none';
  document.getElementById('vt-novo').classList.toggle('active', v==='novo');
  document.getElementById('vt-real').classList.toggle('active', v==='realizados');
  if(v==='realizados'){ populateRealFilters(); renderRealizados(); }
}

function populateRealFilters(){
  const cSel=document.getElementById('rf-contract'), eSel=document.getElementById('rf-estab');
  if(!cSel||!eSel) return;
  const cAtual=cSel.value, eAtual=eSel.value;
  const cs=[...new Set(laudosCache.map(l=>String(l.contract||'')).filter(Boolean))].sort();
  const es=[...new Set(laudosCache.map(l=>String(l.unidade||'')).filter(Boolean))].sort();
  const razao=n=>{ const c=contratos().find(x=>String(x.numero)===String(n)); return c&&c.razao?` — ${c.razao}`:''; };
  cSel.innerHTML='<option value="">Todos</option>'+cs.map(c=>`<option value="${esc(c)}">${esc(c)}${esc(razao(c))}</option>`).join('');
  eSel.innerHTML='<option value="">Todos</option>'+es.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
  if([...cSel.options].some(o=>o.value===cAtual)) cSel.value=cAtual;
  if([...eSel.options].some(o=>o.value===eAtual)) eSel.value=eAtual;
}

function renderRealizados(){
  const el=document.getElementById('l-lista'); if(!el) return;
  const fc=(document.getElementById('rf-contract')||{}).value||'';
  const fe=(document.getElementById('rf-estab')||{}).value||'';
  const ini=(document.getElementById('rf-ini')||{}).value||'';
  const fim=(document.getElementById('rf-fim')||{}).value||'';
  const mes=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
  const lista=laudosCache.filter(l=>{
    if(fc && String(l.contract||'')!==fc) return false;
    if(fe && String(l.unidade||'')!==fe) return false;
    const m=mes(l.createdAt||Date.now());
    if(ini && m<ini) return false;
    if(fim && m>fim) return false;
    return true;
  });
  if(!lista.length){ el.innerHTML='<div style="color:var(--text-3);font-size:13px;padding:8px 0">Nenhum laudo no filtro selecionado.</div>'; return; }
  const podeExcluir=['admin','diretor','supervisor'].includes((typeof getCurrentUser==='function'?getCurrentUser():{}).role);
  el.innerHTML = lista.map(l=>`
    <div style="display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:10px 0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(l.unidade||'—')}</div>
        <div style="font-size:12px;color:var(--text-3)">Contrato ${esc(l.contract||'—')} · ${esc(l.assunto||'')} · ${new Date(l.createdAt).toLocaleDateString('pt-BR')}</div>
      </div>
      <button onclick="gerarPDFde('${l.id}')" style="border:none;background:none;cursor:pointer;font-size:16px" title="Gerar PDF">🖨️</button>
      <button onclick="reabrirLaudo('${l.id}')" style="border:none;background:none;cursor:pointer;font-size:16px" title="Reabrir para editar">✏️</button>
      ${podeExcluir?`<button onclick="excluirLaudo('${l.id}')" style="border:none;background:none;cursor:pointer;font-size:16px" title="Excluir">🗑️</button>`:''}
    </div>`).join('');
}

function gerarPDFde(id){ const l=laudosCache.find(x=>x.id===id); if(l) gerarPDF(l); }
async function excluirLaudo(id){
  const l=laudosCache.find(x=>x.id===id);
  if(!confirm('Excluir o laudo de '+(l?l.unidade:'')+'?')) return;
  try{ await laudoDel(id); laudosCache=laudosCache.filter(x=>x.id!==id); populateRealFilters(); renderRealizados(); showToast('Laudo excluído'); }
  catch(e){ showToast('Erro ao excluir: '+(e.message||e)); }
}
function reabrirLaudo(id){
  const l = laudosCache.find(x=>x.id===id); if(!l) return;
  switchView('novo');
  currentLaudoId = l.id;
  document.getElementById('l-contract').value = l.contract||''; onContractChange();
  setScope(l.escopo||'equipamento');
  if((l.escopo||'equipamento')==='unidade'){
    document.getElementById('l-estab').value = l.unidade||'';
  } else {
    itensLaudo = Array.isArray(l.itens) ? l.itens.slice() : []; renderItens();
  }
  document.getElementById('l-assunto').value = l.assunto||'';
  document.getElementById('l-kw').value = l.palavrasChave||'';
  document.getElementById('l-texto').value = l.texto||'';
  fotos = Array.isArray(l.photos)?l.photos:[]; renderFotos();
  _pdfData = null;
  window.scrollTo({top:0, behavior:'smooth'});
  showToast('Laudo carregado — edite e gere o PDF');
}
</script>
