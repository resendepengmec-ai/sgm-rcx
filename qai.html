<script>
// ══════════════════════════════════════════════════════════════════
// QAI — Qualidade do Ar Interior
// ══════════════════════════════════════════════════════════════════
// Sem leitura manual. Grandezas são genéricas: a tela mostra o que o
// dispositivo realmente reporta (grandezasDisponiveis), e o admin escolhe
// quais medir e armazenar. Rótulo, unidade e cor vêm do próprio sensor,
// nunca de uma lista fixa de tipos.

const REGIOES_TUYA = { us: 'Américas (us)', eu: 'Europa (eu)', cn: 'China (cn)', in: 'Índia (in)' };
const FREQUENCIAS = [0, 1, 2, 3, 4, 6, 12];

let user = null;
let CONTRATOS = [];
let LINHAS = [];            // dashboard do contrato selecionado (todos os status)
let ABA_STATUS = 'ativos';  // aba atual: 'ativos' | 'inativos' | 'excluidos'
let SENSOR_ABERTO = null;   // sensor completo exibido no modal
let LEITURAS_ABERTO = [];
let CHARTS_DASH = [];       // gráficos do histórico do dia
let LEITURAS_DIA = [];      // leituras do dia selecionado
let DIA_SELECIONADO = null; // dia local AAAA-MM-DD
// Preferência de exibição: agora é configuração do SENSOR (persistida no
// servidor, aba Configurações), não mais um botão de sessão no dashboard.
const PADRAO_EXIBICAO = { modoValor: 'cartoes', agrupar: true };
function exibicaoDoSensor(s) { return s?.exibicao || PADRAO_EXIBICAO; }
let DIA_REQ = 0;            // controla respostas de dias antigos
let LOCAIS = [];             // estabelecimentos/recintos do contrato (autocomplete)
let LOCAIS_CONTRATO = null;  // contrato a que LOCAIS pertence
let DISPONIVEIS_RENDER = []; // ordem das linhas de grandezas, lida no salvar
let LIMITES_RENDER = [];     // ordem das linhas de limites, lida no salvar
let CONFIGS_LOCAL = new Map(); // estabelecimento (normalizado) -> config de local, do contrato atual
let CONFIGS_LOCAL_CONTRATO = null; // contrato a que CONFIGS_LOCAL pertence
let CONFIG_LOCAL_EDITANDO = null; // nome do estabelecimento em edição no modal
let ESTAT_INICIO = '', ESTAT_FIM = '', ESTAT_PERIODO = '24h'; // filtros da tela de Estatísticas
let ESTAT_SEQ = 0;          // ignora resposta antiga depois de trocar o filtro de novo
let CHARTS_ESTAT = [];

function showToast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }

// ── Cores: hash FNV-1a → paleta; colisões resolvidas por probing linear
// sobre a lista ORDENADA de códigos do gráfico — mesma entrada, mesma cor.
const PALETA_COR = ['#7c3aed', '#0891b2', '#059669', '#d97706', '#dc2626', '#2563eb',
  '#db2777', '#65a30d', '#9333ea', '#0d9488', '#ea580c', '#4338ca'];
function _hashFnv1a(chave) {
  const s = String(chave);
  let hash = 2166136261;
  for (let i = 0; i < s.length; i++) { hash ^= s.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return hash;
}
function coresParaChaves(chaves) {
  const usados = new Set();
  const mapa = new Map();
  for (const chave of [...chaves].sort()) {
    let idx = Math.abs(_hashFnv1a(chave)) % PALETA_COR.length;
    while (usados.has(idx)) idx = (idx + 1) % PALETA_COR.length;
    usados.add(idx);
    mapa.set(chave, PALETA_COR[idx]);
  }
  return mapa;
}

// ── Distribuição automática de horários (espelho de qai-schedule.js:
// distribuirHorarios, só para preencher o formulário; o servidor valida).
function distribuirHorariosLocal(x, primeiroHorario) {
  const [hh, mm] = String(primeiroHorario || '00:00').split(':').map(Number);
  const inicio = (hh || 0) * 60 + (mm || 0);
  const passo = 1440 / x;
  const out = [];
  for (let i = 0; i < x; i++) {
    let m = Math.round(inicio + i * passo);
    m = ((m % 1440) + 1440) % 1440;
    out.push(String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'));
  }
  return out;
}

function fmtDataHora(ts) { return ts ? new Date(ts).toLocaleString('pt-BR') : '—'; }
function fmtValor(valor, unidade) {
  if (valor == null) return '—';
  return String(Math.round(valor * 1000) / 1000) + (unidade ? ' ' + unidade : '');
}
// Só pra tela de Estatísticas (Fase 3): uma casa decimal fixa, sempre —
// os cartões ali são resumo/estatística, não a leitura instantânea, então
// não precisam da mesma precisão de fmtValor (usada no dashboard ao vivo,
// no gauge e no PDF, que continuam como estavam).
function fmtValorEstat(valor, unidade) {
  if (valor == null) return '—';
  return valor.toFixed(1) + (unidade ? ' ' + unidade : '');
}
function tempoRelativo(ts) {
  if (!ts) return '—';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}

// ── Locais do contrato (autocomplete do cadastro) ──────────────────
// Sugestões vêm dos equipamentos já cadastrados no contrato. O campo
// continua aceitando texto livre, para um local que ainda não tem
// equipamento; a sugestão só evita grafias diferentes do mesmo lugar.
function _normTexto(v) { return String(v || '').trim().toLocaleLowerCase('pt-BR'); }
function recintosDe(locais, estabelecimento) {
  const alvo = _normTexto(estabelecimento);
  const achado = (locais || []).find(l => _normTexto(l.estabelecimento) === alvo);
  return achado ? achado.recintos : [];
}
async function carregarLocais(contrato) {
  if (!contrato) { LOCAIS = []; LOCAIS_CONTRATO = null; return; }
  if (LOCAIS_CONTRATO === contrato) return;
  try {
    LOCAIS = await DB.getLocaisQai(contrato);
    LOCAIS_CONTRATO = contrato;
  } catch (e) {
    LOCAIS = []; LOCAIS_CONTRATO = null;
    showToast('Não foi possível carregar os locais do contrato: ' + e.message, 5000);
  }
}

// Configuração geográfica (lat/long/fuso) por estabelecimento — carregada
// junto com o sensor (ver abrirSensor) para a aba Configurações já mostrar
// o status sem precisar de um clique extra.
async function carregarConfigsLocal(contrato) {
  if (!contrato) { CONFIGS_LOCAL = new Map(); CONFIGS_LOCAL_CONTRATO = null; return; }
  if (CONFIGS_LOCAL_CONTRATO === contrato) return;
  try {
    const configs = await DB.getConfigLocalQai(contrato);
    CONFIGS_LOCAL = new Map((configs || []).map(c => [_normTexto(c.estabelecimento), c]));
    CONFIGS_LOCAL_CONTRATO = contrato;
  } catch (e) {
    CONFIGS_LOCAL = new Map(); CONFIGS_LOCAL_CONTRATO = null;
    showToast('Não foi possível carregar a configuração de local: ' + e.message, 5000);
  }
}
function atualizarDatalistRecinto(idRecinto, estabelecimento) {
  document.getElementById(idRecinto).innerHTML =
    recintosDe(LOCAIS, estabelecimento).map(r => `<option value="${esc(r)}"></option>`).join('');
}
function preencherDatalists(idEstab, idRecinto, estabelecimentoAtual) {
  document.getElementById(idEstab).innerHTML =
    LOCAIS.map(l => `<option value="${esc(l.estabelecimento)}"></option>`).join('');
  atualizarDatalistRecinto(idRecinto, estabelecimentoAtual);
}

// ── Configuração de local (Fase 1 — Estatísticas QAI) ───────────────
// Latitude/longitude/fuso/diurno-noturno por estabelecimento — dado
// estrutural, não operação do dia a dia; mesma faixa de papel que já
// edita contrato no resto do sistema (authz.SUPERVISOR_ACIMA, aplicado
// no servidor — isto só evita mostrar um botão que ele rejeitaria).
function podeConfigurarLocalQai(role) {
  return ['admin', 'admin_cliente', 'diretor', 'supervisor'].includes(role);
}

// Acesso sempre a partir do sensor aberto (Configurações > Local) — a
// localização é dado do ESTABELECIMENTO (compartilhada por todos os
// sensores daquele local), mas não há mais uma tela solta pra "escolher
// qual estabelecimento configurar": o sensor já diz qual é.
async function abrirGeoSensor() {
  const s = SENSOR_ABERTO;
  if (!s) return;
  await carregarConfigsLocal(s.contrato);
  CONFIG_LOCAL_EDITANDO = s.estabelecimento;
  renderConfigLocal();
  abrirModal('modal-config-local');
}

function renderConfigLocal() {
  const el = document.getElementById('config-local-conteudo');
  const cfg = CONFIGS_LOCAL.get(_normTexto(CONFIG_LOCAL_EDITANDO)) || {};
  el.innerHTML = `
    <div class="modal-title">${esc(CONFIG_LOCAL_EDITANDO)}</div>
    <div class="qai-sub">
      Latitude/longitude e fuso definem o relógio local do
      estabelecimento, usado para calcular os períodos diurno e
      noturno nas estatísticas. A noite é contada pela data em que
      COMEÇOU — ex.: 23h de um dia e 3h da madrugada seguinte
      pertencem à mesma "noite", não a duas noites diferentes.
    </div>
    <div class="field">
      <label>Colar coordenadas do Google Maps</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="cfgl-colar" placeholder="ex.: -16.81491152196471, -49.242589442946105" style="flex:1">
        <button type="button" class="btn btn-secondary btn-sm" onclick="aplicarCoordenadasColadas()">Aplicar</button>
      </div>
      <div class="qai-sub">No Google Maps, clique com o botão direito sobre o ponto exato: o primeiro item do menu já é "latitude, longitude" — cole aqui.</div>

      <label>Latitude</label>

    </div>
    <div class="field">
      <label>Longitude</label>
      <input type="number" id="cfgl-lon" step="0.000001" min="-180" max="180" value="${cfg.longitude ?? ''}" placeholder="ex.: -49.264794">
    </div>
    <div class="field">
      <label>Fuso horário (IANA)</label>
      <input type="text" id="cfgl-tz" list="dl-fusos" maxlength="60" value="${esc(cfg.timezone || 'America/Sao_Paulo')}" placeholder="ex.: America/Sao_Paulo">
      <datalist id="dl-fusos">
        <option value="America/Sao_Paulo"></option>
        <option value="America/Manaus"></option>
        <option value="America/Rio_Branco"></option>
        <option value="America/Noronha"></option>
        <option value="UTC"></option>
      </datalist>
    </div>
    <div class="field">
      <label>Início do período diurno</label>
      <input type="time" id="cfgl-diurno-inicio" value="${cfg.diurnoInicio || '06:00'}">
    </div>
    <div class="field">
      <label>Fim do período diurno</label>
      <input type="time" id="cfgl-diurno-fim" value="${cfg.diurnoFim || '18:00'}">

    <div class="qai-sub">O período noturno é o complemento automático do diurno (ex.: diurno 06:00–18:00 → noturno 18:00–06:00 do dia seguinte).</div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="fecharModal('modal-config-local')">Fechar</button>
      <button class="btn btn-primary" id="btn-salvar-config-local" onclick="salvarConfigLocal(this)">Salvar</button>
    </div>`;
}

// Formato exato que o Google Maps copia ao clicar com o botão direito
// num ponto: "-16.81491152196471, -49.242589442946105".
function aplicarCoordenadasColadas() {
  const texto = document.getElementById('cfgl-colar').value;
  const m = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(texto);
  if (!m) { showToast('Cole no formato "latitude, longitude", copiado do Google Maps.', 6000); return; }
  const lat = Number(m[1]), lon = Number(m[2]);
  if (lat < -90 || lat > 90) { showToast('Latitude fora do intervalo válido (-90 a 90).', 6000); return; }
  if (lon < -180 || lon > 180) { showToast('Longitude fora do intervalo válido (-180 a 180).', 6000); return; }
  document.getElementById('cfgl-lat').value = lat;
  document.getElementById('cfgl-lon').value = lon;
  document.getElementById('cfgl-colar').value = '';
  showToast('Coordenadas aplicadas — confira e clique em Salvar.');
}

// Sem coordenadas ainda: abre uma busca pelo nome do estabelecimento, pra
// ajudar a localizar e copiar as coordenadas de lá.
function abrirGoogleMaps() {
  const lat = document.getElementById('cfgl-lat').value;
  const lon = document.getElementById('cfgl-lon').value;
  const url = (lat !== '' && lon !== '')
    ? `https://www.google.com/maps?q=${encodeURIComponent(lat + ',' + lon)}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG_LOCAL_EDITANDO || '')}`;
  window.open(url, '_blank', 'noopener');
}

// Rótulo e unidade de um data point, a partir do próprio sensor.
function infoGrandeza(sensor, code) {
  const a = sensor?.grandezasAtivas?.[code];
  if (a) return { rotulo: a.rotulo || code, unidade: a.unidade || '' };
  const d = (sensor?.grandezasDisponiveis || []).find(x => x.code === code);
  if (d) return { rotulo: d.rotulo || code, unidade: d.unidade || '' };
  return { rotulo: code, unidade: '' };
}
function codigosDe(valores) { return Object.keys(valores || {}).sort(); }

// ── Lista / dashboard ────────────────────────────────────────────────
// incluirExcluidos:true numa chamada só — as 3 abas (Ativos/Inativos/
// Excluídos) filtram LINHAS no cliente, sem precisar de 1 fetch por aba.
async function carregarLista() {
  const contrato = document.getElementById('f-contrato').value;
  if (!contrato) return;
  const lista = document.getElementById('qai-lista');
  lista.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    LINHAS = await DB.getDashboardQai(contrato, { incluirExcluidos: true });
    renderLista();
  } catch (e) {
    lista.innerHTML = '<div class="empty">Não foi possível carregar os sensores.</div>';
    showToast('Erro ao carregar sensores: ' + e.message, 6000);
  }
}

function linhasDaAba(aba) {
  if (aba === 'excluidos') return LINHAS.filter(l => l.sensor.excluidoEm);
  if (aba === 'inativos')  return LINHAS.filter(l => !l.sensor.excluidoEm && !l.sensor.sensorAtivo);
  return LINHAS.filter(l => !l.sensor.excluidoEm && l.sensor.sensorAtivo); // 'ativos'
}

function renderLista() {
  const lista = document.getElementById('qai-lista');
  const linhas = linhasDaAba(ABA_STATUS);
  if (!LINHAS.length) {
    lista.innerHTML = '<div class="empty">Nenhum sensor cadastrado neste contrato ainda.<br>Use "+ Novo sensor" para começar.</div>';
    return;
  }
  if (!linhas.length) {
    const msg = ABA_STATUS === 'excluidos' ? 'Nenhum sensor excluído.' : `Nenhum sensor ${ABA_STATUS === 'ativos' ? 'ativo' : 'inativo'} neste contrato.`;
    lista.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  lista.innerHTML = linhas.map(renderCard).join('');
}

function renderCard(linha) {
  const s = linha.sensor;
  const tel = linha.telemetriaAoVivo;
  const leitura = linha.ultimaLeitura;
  const valores = tel ? tel.valores : (leitura ? leitura.valores : {});
  const conforme = tel ? tel.conforme : (leitura ? leitura.conforme : null);
  const quando = tel ? tel.recebidoEm : (leitura ? leitura.criadoEm : null);

  // Excluído: card somente leitura (abrirSensor chama GET /sensores/:id
  // primeiro, que 404 pra sensor excluído — nunca é clicável) com botão
  // pra restaurar, em vez das ações normais.
  if (s.excluidoEm) {
    return `<div class="qai-card excluido">
      <div class="qai-card-top">
        <div>
          <div class="qai-card-titulo">${esc(s.estabelecimento)} · ${esc(s.recinto)}</div>
          <div class="qai-card-sub"><span class="badge inativo">Excluído em ${new Date(s.excluidoEm).toLocaleDateString('pt-BR')}</span></div>
        </div>
      </div>
      <div class="qai-card-rodape">Histórico de leituras preservado.</div>
      <div class="action-bar" style="margin-top:8px">
        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="event.stopPropagation();restaurarSensor('${s.id}', this)">↩ Restaurar</button>
      </div>
    </div>`;
  }

  const badgeConforme = conforme === true ? '<span class="badge conforme">✓ Conforme</span>'
    : conforme === false ? '<span class="badge fora">⚠ Fora do limite</span>'
    : '<span class="badge semlimite">sem limite</span>';

  const chips = codigosDe(valores).map(c => {
    const i = infoGrandeza(s, c);
    return `<span class="qai-valor">${esc(i.rotulo)}: ${fmtValor(valores[c], i.unidade)}</span>`;
  }).join('');

  return `<div class="qai-card ${s.sensorAtivo ? 'ativo' : 'inativo'}" onclick="abrirSensor('${s.id}')">
    <div class="qai-card-top">
      <div>
        <div class="qai-card-titulo">${esc(s.estabelecimento)} · ${esc(s.recinto)}</div>
        <div class="qai-card-sub">${s.sensorAtivo ? '<span class="badge ativo">Ativo</span>' : '<span class="badge inativo">Inativo</span>'} ${quando ? badgeConforme : ''}</div>
      </div>
    </div>
    <div class="qai-card-valores">${chips || '<span class="qai-valor">sem leitura ainda</span>'}</div>
    <div class="qai-card-rodape">${quando ? 'Última leitura: ' + tempoRelativo(quando) : 'Nunca sincronizado'}</div>
    ${s.sensorAtivo ? `
      <div class="action-bar" style="margin-top:8px">
        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="event.stopPropagation();abrirEstatisticas('${s.id}')">📊 Estatísticas</button>
      </div>` : ''}
  </div>`;
}

async function restaurarSensor(id, btn) {
  if (!confirm('Restaurar este sensor? Ele volta pra aba Inativos, sem religar o polling automaticamente.')) return;
  await withActionBusy(btn, 'Restaurando…', async () => {
    try {
      await DB.restaurarSensorQai(id);
      showToast('Sensor restaurado.');
      ABA_STATUS = 'inativos';
      selectTab('#qai-status-tabs', 'inativos');
      carregarLista();
    } catch (e) { showToast('Erro ao restaurar: ' + e.message, 6000); }

}

// "dashboard" (padrão ao clicar no card): grandezas, histórico e PDF.
// "config": ações, local, credenciais, grandezas, limites e horários.
let MODO_MODAL = 'dashboard';
let APARELHOS_ABERTO = [];
let DASH_LINHA = null; // linha do dashboard do contrato: telemetria "agora" do sensor
let PRESTADORA = {};   // dados da empresa para o cabeçalho dos PDFs

// modo: 'dashboard' ao abrir pelo card; 'config' ao criar sensor novo; no
// refresh interno, o chamador passa MODO_MODAL para manter a visão atual.
async function abrirSensor(id, modo = 'dashboard') {
  MODO_MODAL = modo;
  abrirModal('modal-sensor');
  document.getElementById('sensor-modal-conteudo').innerHTML = 'Carregando…';
  try {
    const sensor = await DB.getSensorQai(id);
    const [leituras, aparelhos, linhas] = await Promise.all([
      DB.getLeiturasQai(id, '?limite=50'), DB.getAparelhosQai(id), DB.getDashboardQai(sensor.contrato),
    ]);
    if (!SENSOR_ABERTO || SENSOR_ABERTO.id !== sensor.id) DIA_SELECIONADO = null;
    SENSOR_ABERTO = sensor;
    LEITURAS_ABERTO = leituras;
    APARELHOS_ABERTO = aparelhos || [];
    DASH_LINHA = (linhas || []).find(l => l.sensor.id === id) || null;
    await Promise.all([carregarLocais(sensor.contrato), carregarConfigsLocal(sensor.contrato)]);
    renderModalSensor();
  } catch (e) {
    document.getElementById('sensor-modal-conteudo').innerHTML =
      `<div class="empty">Não foi possível carregar o sensor: ${esc(e.message)}</div>`;
  }
}

function irParaModo(modo) {

          <span class="badge historico" title="Resume leituras já registradas no período escolhido — não projeta nem estima valores futuros.">📊 Histórico — sem previsão</span>
          <button type="button" class="qai-info-btn" onclick="abrirAjudaEstatisticas()" title="O que significam esses números?" aria-label="O que significam esses números?">i</button>
        </div>
      </div>
      <div class="card">
        <div class="qai-grid2">

async function abrirEstatisticas(id) {
  ESTAT_INICIO = ''; ESTAT_FIM = ''; ESTAT_PERIODO = '24h'; // cada sensor abre com os defaults, nunca o filtro do sensor anterior
  await abrirSensor(id, 'estatisticas');
}

// ── Estatísticas: busca + render (Fase 3 — Interface) ───────────────
async function buscarEstatisticas() {
  const s = SENSOR_ABERTO;
  const cont = document.getElementById('estat-conteudo');
  if (!s || !cont) return;
  // Sem fallback pra ESTAT_INICIO/FIM aqui: o campo é a fonte da verdade
  // quando o modal já está aberto — um campo de data limpo pelo usuário
  // precisa ser tratado como "vazio de propósito", nunca reviver um
  // valor antigo que sobrou de uma busca anterior.
  const inicioStr = document.getElementById('estat-inicio')?.value ?? '';
  const fimStr = document.getElementById('estat-fim')?.value ?? '';
  const periodo = document.getElementById('estat-periodo')?.value || '24h';
  ESTAT_INICIO = inicioStr; ESTAT_FIM = fimStr; ESTAT_PERIODO = periodo;
  if (!inicioStr || !fimStr) { cont.innerHTML = '<div class="qai-sub" style="margin:0">Selecione a data inicial e final.</div>'; return; }
  const inicio = limitesDoDia(inicioStr).desde;
  const fim = limitesDoDia(fimStr).ate;
  if (inicio > fim) { cont.innerHTML = '<div class="empty">A data inicial não pode ser depois da final.</div>'; return; }

  // Sequência própria: se o usuário trocar o filtro de novo antes desta
  // resposta voltar, a resposta velha é descartada ao chegar — nunca
  // sobrescreve um resultado mais novo que já apareceu na tela.
  const minhaVez = ++ESTAT_SEQ;
  cont.innerHTML = '<div class="qai-sub" style="margin:0">Carregando estatísticas…</div>';
  try {
    const q = `?inicio=${inicio}&fim=${fim}&periodo=${periodo}`;
    // Comparação (Fase 5) nunca derruba as estatísticas (Fase 2/3) se
    // falhar — tem o próprio catch, sempre resolve com disponivel:false
    // em vez de rejeitar o Promise.all inteiro.
    const [r, comparacao, alertaClima] = await Promise.all([
      DB.getEstatisticasQai(s.id, q),
      DB.getComparacaoQai(s.id, q).catch(e => ({ disponivel: false, motivo: e.message })),
      // Alerta de previsão (Fase 4b) é independente do período acima
      // (olha pra FRENTE, não pro intervalo histórico filtrado) — mas
      // entra no mesmo Promise.all pra não atrasar a tela esperando uma
      // 3ª chamada sequencial; mesmo catch defensivo dos outros dois.
      DB.getAlertaClimaQai(s.id).catch(e => ({ disponivel: false, motivo: e.message })),
    ]);
    if (minhaVez !== ESTAT_SEQ) return; // resposta de um filtro antigo — ignorada
    renderResultadoEstatisticas(s, r, comparacao, alertaClima);
  } catch (e) {
    if (minhaVez !== ESTAT_SEQ) return;
    // Estatística é um complemento — uma falha aqui nunca deve parecer
    // que o monitoramento do sensor parou; só avisa e deixa tentar de novo.
    cont.innerHTML = `<div class="empty">Não foi possível calcular as estatísticas agora.<div class="qai-sub" style="margin-top:6px">${esc(e.message)}</div>
      <div class="action-bar" style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="buscarEstatisticas()">Tentar novamente</button></div></div>`;
  }
}

function kpiCardEstatistica(g) {
  if (!g.amostrasValidas) {
    return `<div class="qai-kpi sem">
      <div class="qai-kpi-label">${esc(g.rotulo)}</div>
      <div class="qai-kpi-sub">📊 Dados insuficientes — nenhuma leitura válida desta grandeza no período/filtro selecionado.</div>
    </div>`;
  }
  const classe = !g.amostrasComLimiteAplicavel ? 'sem' : g.amostrasForaDoLimite > 0 ? 'fora' : 'ok';
  const desvioTxt = g.desvioPadrao != null
    ? `desvio-padrão ${fmtValorEstat(g.desvioPadrao, g.unidade)}`
    : 'desvio-padrão: dados insuficientes (mín. 2 amostras)';
  const metaTxt = g.meta != null
    ? ` · desvio da meta ${g.desvioDaMeta >= 0 ? '+' : ''}${fmtValorEstat(g.desvioDaMeta, g.unidade)} (meta ${fmtValorEstat(g.meta, g.unidade)})`
    : '';
  const limiteTxt = g.amostrasComLimiteAplicavel
    ? `${Math.round(g.proporcaoForaDoLimite * 100)}% das ${g.amostrasComLimiteAplicavel} amostra(s) com limite aplicável ficaram fora dele`
    : 'sem limite histórico aplicável nas amostras deste período';
  return `<div class="qai-kpi ${classe}">
    <div class="qai-kpi-label">${esc(g.rotulo)}</div>
    <div class="qai-kpi-val">${fmtValorEstat(g.media, '')}<span class="qai-kpi-un">${esc(g.unidade)}</span></div>
    <div class="qai-kpi-sub">média por amostra · ${g.amostrasValidas} amostra(s)</div>
    <div class="qai-kpi-sub">mín ${fmtValorEstat(g.minimo, g.unidade)} · máx ${fmtValorEstat(g.maximo, g.unidade)}</div>
    <div class="qai-kpi-sub">${desvioTxt}${metaTxt}</div>
    <div class="qai-kpi-sub">${limiteTxt}</div>
  </div>`;
}

// Prioriza temperatura/umidade quando existirem entre as grandezas ATIVAS
// do sensor — nunca presume que todo sensor as tem; os demais parâmetros
// só aparecem aqui porque já vieram de volta na resposta (ou seja, são de
// fato medidos por este sensor).
function ordenarGrandezasEstatistica(grandezas) {
  const prioridade = g => g.code.includes('temp') ? 0 : g.code.includes('humid') ? 1 : 2;
  return [...grandezas].sort((a, b) => prioridade(a) - prioridade(b));
}

// ── Alerta de previsão climática (Fase 4b) ──────────────────────────
// Olha pra FRENTE (dias que ainda vão acontecer) — por isso tem seu
// próprio rótulo "🔮 Previsão" (nunca o badge "histórico" usado no resto
// da tela) e um aviso fixo deixando claro que é uma estimativa de
// modelo meteorológico, não uma garantia.
function diaDaSemanaCurto(dataISO) {
  try {
    return new Date(dataISO + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  } catch { return ''; }
}
function renderAlertaClima(a) {
  const cont = document.getElementById('estat-alerta-clima');
  if (!cont) return;
  if (!a.disponivel) {
    // Mesma política discreta da comparação: nunca aparenta erro grave
    // em cima de uma tela que já carregou com sucesso.
    cont.innerHTML = `<div class="card qai-alerta-clima" style="margin-bottom:14px"><div class="card-title">⛅ Alerta de previsão climática</div><div class="qai-sub">${esc(a.motivo || 'Indisponível.')}</div></div>`;
    return;
  }
  if (a.semLimitesConfigurados) {
    cont.innerHTML = `<div class="card qai-alerta-clima" style="margin-bottom:14px">
      <div class="card-title">⛅ Alerta de previsão climática</div>
      <div class="qai-sub">Configure um limite de temperatura e/ou umidade (menu ⚙ Configurações → Limites) para habilitar o alerta — o alerta só dispara em cima do limite que o próprio gestor já configurou, nunca um limiar genérico inventado aqui.</div>
    </div>`;
    return;
  }
  const diasComAlerta = a.dias.filter(d => d.alertas.length);
  cont.innerHTML = `
    <div class="card qai-alerta-clima" style="margin-bottom:14px">
      <div class="card-title">⛅ Alerta de previsão climática <span class="badge previsao" style="margin-left:6px" title="Olha pra FRENTE — estimativa do modelo meteorológico pros próximos dias, nunca uma garantia.">🔮 previsão — próximos ${a.dias.length} dia(s)</span></div>
      ${diasComAlerta.length ? diasComAlerta.map(d => `
        <div class="qai-alerta-dia">
          <div class="qai-alerta-dia-data">${esc(diaDaSemanaCurto(d.data))} ${esc(d.data.split('-').reverse().slice(0,2).join('/'))}</div>
          <div class="qai-alerta-dia-itens">${d.alertas.map(al => `⚠️ ${esc(al.rotulo)} prevista ${al.tipo === 'acima' ? 'acima do máximo' : 'abaixo do mínimo'} configurado (${fmtValorEstat(al.valorPrevisto, '')} vs. limite ${fmtValorEstat(al.limite, '')})`).join('<br>')}</div>
        </div>
      `).join('') : `<div class="qai-sub">✅ Nenhum dia dos próximos ${a.dias.length} foge dos limites configurados, segundo a previsão atual.</div>`}
      <div class="qai-sub" style="margin-top:8px">Previsão de modelo meteorológico (Open-Meteo) para a localização configurada — quanto mais distante o dia, menos confiável a estimativa. Nunca é uma medição do sensor.</div>
    </div>`;
}

// ── Comparação interno/externo (Fase 5) ─────────────────────────────
function renderComparacao(c) {
  const cont = document.getElementById('estat-comparacao');
  if (!cont) return;
  if (!c.disponivel) {
    // Complemento opcional — nunca um "erro" vermelho em cima das
    // estatísticas (que já carregaram com sucesso); só um aviso discreto.
    cont.innerHTML = `<div class="card"><div class="card-title">🌡️ Comparação com o clima externo <span class="badge historico" style="margin-left:6px">histórico</span></div><div class="qai-sub">${esc(c.motivo || 'Indisponível.')}</div></div>`;
    return;
  }
  const semParesTemp = c.cobertura.paresTemperatura === 0;
  const correlacaoTxt = c.temperatura.correlacao != null
    ? `Correlação (temperatura): ${c.temperatura.correlacao.toFixed(2)}`
    : `Correlação (temperatura): dados insuficientes${c.temperatura.correlacaoIndisponivel ? ' — ' + esc(c.temperatura.correlacaoIndisponivel) : ''}`;
  const avisoRecorte = c.serieTemporalTruncada
    ? `<div class="qai-sub">⚠️ Período tem mais leituras do que o recorte usado aqui — a comparação reflete só as mais recentes dentro do período, não o período inteiro.</div>`
    : '';
  cont.innerHTML = `
    <div class="card">
      <div class="card-title">🌡️ Comparação com o clima externo <span class="badge historico" style="margin-left:6px" title="Compara leituras já registradas com o clima que já ocorreu no mesmo horário — nunca uma previsão.">histórico</span></div>
      ${avisoRecorte}
      ${semParesTemp ? `<div class="qai-sub">📊 Dados insuficientes — nenhum par interno/externo dentro da tolerância de ${c.toleranciaMin} min neste período.</div>` : `
        <div class="qai-kpis">
          <div class="qai-kpi ${c.temperatura.diferencaMedia > 0 ? 'fora' : 'ok'}">
            <div class="qai-kpi-label">Temperatura interna − externa</div>
            <div class="qai-kpi-val">${c.temperatura.diferencaMedia >= 0 ? '+' : ''}${fmtValorEstat(c.temperatura.diferencaMedia, '°C')}</div>
            <div class="qai-kpi-sub">média de ${c.cobertura.paresTemperatura} par(es) válido(s)</div>
          </div>
          ${c.cobertura.paresUmidade ? `
            <div class="qai-kpi sem">
              <div class="qai-kpi-label">Umidade (relativa)</div>
              <div class="qai-kpi-sub">${c.cobertura.paresUmidade} par(es) — interna e externa comparadas lado a lado no gráfico</div>
            </div>` : ''}
          <div class="qai-kpi sem">
            <div class="qai-kpi-label">${correlacaoTxt.split(':')[0]}</div>
            <div class="qai-kpi-sub">${correlacaoTxt.split(': ').slice(1).join(': ')}</div>
          </div>
        </div>

      <div class="qai-sub">${esc(c.avisos.dependenciaTemporal)}</div>
      <div class="qai-sub">${esc(c.avisos.umidadeRelativa)}</div>
    </div>`;
}

// Reaproveita a MESMA infraestrutura de gráfico do dashboard/PDF
// (datasetsDoGrupo/escalasYDoGrupo/faixasDoLimite/pluginFaixaLimites),
// só troca o eixo X pra instante em ms (pontosDoPeriodo/rotuloTempoPdf —
// já usados no PDF de período) em vez de minuto-do-dia: o intervalo
// escolhido aqui pode ter vários dias, não só um.
function renderGraficoEstatisticas(s, serie, truncada) {
  const cont = document.getElementById('estat-graficos');
  if (!cont) return;
  const codigos = Object.keys(s.grandezasAtivas || {}).filter(c => serie.some(l => l.valores?.[c] != null));
  if (!codigos.length) { cont.innerHTML = '<div class="qai-sub">Nenhuma das grandezas ativas aparece nas leituras deste período.</div>'; return; }
  const cores = coresParaChaves(codigos);
  const grupos = montarGrupos(s, codigos, exibicaoDoSensor(s).agrupar);
  const tsOrdenados = serie.map(l => l.criadoEm);
  const spanDias = Math.max(1, Math.round((Math.max(...tsOrdenados) - Math.min(...tsOrdenados)) / 86400000));

  cont.innerHTML = (truncada ? `<div class="qai-sub" style="margin-bottom:6px">Mostrando as ${serie.length} leituras mais recentes dentro do período selecionado.</div>` : '') +
    grupos.map((grupo, k) => `
      <div class="qai-grafico-bloco">
        <div class="qai-grafico-titulo">${grupo.flatMap(b => b.codigos).map(c => esc(abreviacaoGrandeza(s, c))).join(' × ')}</div>
        <div class="qai-chart-wrap"><canvas id="ch-estat-${k}"></canvas></div>
      </div>`).join('');

  grupos.forEach((grupo, k) => {
    const ctx = document.getElementById(`ch-estat-${k}`);
    if (!ctx) return;
    const datasets = datasetsDoGrupo(s, grupo, cores, serie, pontosDoPeriodo);
    const xs = datasets.flatMap(d => d.data.map(p => p.x));
    if (!xs.length) return;
    const { escalas, faixasPorEixo } = escalasYDoGrupo(s, grupo, cores, serie, pontosDoPeriodo);
    escalas.x = {
      type: 'linear', min: Math.min(...xs), max: Math.max(...xs),
      ticks: { maxTicksLimit: 8, color: '#475569', font: { size: 10 }, callback: v => rotuloTempoPdf(v, spanDias) },
      grid: { display: false },
      title: { display: true, text: spanDias <= 2 ? 'Horário' : 'Data', color: '#475569', font: { size: 10 } },
    };
    CHARTS_ESTAT.push(new Chart(ctx, {
      type: 'line', data: { datasets },
      options: opcoesGraficoBase(escalas, items => items.length ? rotuloTempoPdf(items[0].parsed.x, spanDias) : ''),
      plugins: [pluginFaixaLimites(faixasPorEixo)],
    }));
  });
}

// PATCH com _version (lock otimista). Em conflito, recarrega o sensor.
async function patchSensorAtual(dados, mensagemOk) {
  try {
    const atualizado = await DB.updateSensorQai(SENSOR_ABERTO.id, { ...dados, _version: SENSOR_ABERTO._version });
    SENSOR_ABERTO = atualizado;
    renderModalSensor();
    carregarLista();
    if (mensagemOk) showToast(mensagemOk);
    return atualizado;
  } catch (e) {
    if (e.code === 'VERSION_CONFLICT') {
      showToast('Este sensor foi alterado em outro envio — recarregando dados atuais…', 5000);
      await abrirSensor(SENSOR_ABERTO.id, MODO_MODAL);
    } else {
      showToast('Erro: ' + e.message, 6000);
    }
    throw e;
  }
}

// ── Ações: ativar/desativar/sincronizar/excluir ─────────────────────
function renderAcoes(s) {
  document.getElementById('sec-acoes').innerHTML = `
    <div class="card">
      <div class="action-bar" style="flex-wrap:wrap;margin-top:0">
        ${s.sensorAtivo
          ? `<button class="btn btn-secondary btn-sm" style="flex:1" onclick="desativarSensorAtual(this)">⏸ Desativar</button>`
          : `<button class="btn btn-primary btn-sm" style="flex:1" onclick="ativarSensorAtual(this)">▶ Ativar</button>`}
        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="sincronizarSensorAtual(this)">↻ Sincronizar agora</button>
        <button class="btn btn-danger btn-sm" style="flex:1" onclick="excluirSensorAtual(this)">🗑 Excluir</button>
      </div>
      <div class="qai-sub" style="margin-top:8px;margin-bottom:0">
        ${s.ultimoTesteOk ? 'Último teste de conexão OK: ' + fmtDataHora(s.ultimoTesteOk) : 'Conexão nunca testada.'}
      </div>
    </div>`;
}

async function ativarSensorAtual(btn) {
  await withActionBusy(btn, 'Testando conexão…', async () => {
    try {
      const resultado = await DB.ativarSensorQai(SENSOR_ABERTO.id);
      SENSOR_ABERTO = resultado.sensor;
      const orfas = resultado.teste?.grandezasOrfas;
      showToast(orfas?.length
        ? `Sensor ativado. Atenção: data point(s) ${orfas.join(', ')} não existem mais neste dispositivo e foram removidos da coleta.`
        : 'Sensor ativado.', orfas?.length ? 8000 : 3000);
      renderModalSensor();
      carregarLista();
    } catch (e) { showToast('Não foi possível ativar: ' + e.message, 7000); }
  });
}
async function desativarSensorAtual(btn) {
  await withActionBusy(btn, 'Desativando…', async () => {
    try {
      const resultado = await DB.desativarSensorQai(SENSOR_ABERTO.id);
      SENSOR_ABERTO = resultado.sensor;
      showToast('Sensor desativado.');
      renderModalSensor();
      carregarLista();
    } catch (e) { showToast('Erro: ' + e.message, 6000); }
  });
}
async function sincronizarSensorAtual(btn) {
  await withActionBusy(btn, 'Sincronizando…', async () => {
    try {
      const resultado = await DB.sincronizarSensorQai(SENSOR_ABERTO.id);
      if (resultado.formal) showToast('✅ Leitura registrada.');
      else if (resultado.motivo === 'janela_ocupada') showToast('Leitura obtida, mas a janela de medição de hoje já estava preenchida.', 6000);
      else if (resultado.motivo === 'sem_dados') showToast('O dispositivo não reportou nenhum data point ativo.', 6000);
      else showToast('Leitura obtida (sem registro formal).', 6000);
      await abrirSensor(SENSOR_ABERTO.id, MODO_MODAL);
      carregarLista();
    } catch (e) { showToast('Erro ao sincronizar: ' + e.message, 7000); }
  });
}
async function excluirSensorAtual(btn) {
  if (!confirm('Excluir este sensor? O histórico de leituras é mantido — pode ser restaurado na aba Excluídos.')) return;
  await withActionBusy(btn, 'Excluindo…', async () => {
    const idAlvo = SENSOR_ABERTO.id;
    const contratoAlvo = SENSOR_ABERTO.contrato;
    try {
      await DB.deleteSensorQai(idAlvo);
      showToast('Sensor excluído.');
    } catch (e) {
      // A exclusão pode ter chegado ao servidor mesmo que a RESPOSTA se
      // perca (timeout/rede instável) — mesmo princípio de
      // updateChamadoStatus (api-client.js): antes de assustar o usuário
      // com um erro, confere se o sensor já está excluído de verdade.
      if (!e.transient) { showToast('Erro ao excluir: ' + e.message, 6000); return; }
      let jaExcluido = false;
      try {
        const linhas = await DB.getDashboardQai(contratoAlvo, { incluirExcluidos: true });
        jaExcluido = linhas.some(l => l.sensor.id === idAlvo && l.sensor.excluidoEm);
      } catch (e2) { /* não conseguiu confirmar — mantém o erro original */ }
      if (!jaExcluido) { showToast('Erro ao excluir: ' + e.message, 6000); return; }
      showToast('Sensor excluído (confirmado após verificar a conexão).');
    }
    fecharModal('modal-sensor');
    SENSOR_ABERTO = null;
    carregarLista();
  });
}

// ── Leituras recentes + gráfico ──────────────────────────────────────
// ── Dashboard do sensor: uma tile por grandeza ativa + histórico ────
// Valor "agora" = telemetria ao vivo do polling; sem telemetria, a última
// leitura registrada. Situação compara com os limites configurados.
function situacaoGrandeza(valor, limite) {
  if (valor == null) return { classe: 'sem', texto: 'sem leitura' };
  if (!limite || (limite.min == null && limite.max == null)) return { classe: 'sem', texto: 'sem limite' };
  const fora = (limite.min != null && valor < limite.min) || (limite.max != null && valor > limite.max);
  return fora ? { classe: 'fora', texto: 'fora do limite' } : { classe: 'ok', texto: 'dentro do limite' };
}
function textoLimite(limite, unidade) {
  if (!limite) return 'sem limite definido';
  const un = unidade ? ' ' + unidade : '';
  const partes = [];
  if (limite.min != null) partes.push(`mín ${limite.min}${un}`);
  if (limite.max != null) partes.push(`máx ${limite.max}${un}`);
  return partes.length ? partes.join(' · ') : 'sem limite definido';
}
// ── Gauge: arco semicircular em SVG inline (sem lib) ────────────────
// Reaproveita faixasDoLimite (mesma regra de verde/vermelho dos gráficos
// de linha) — a única diferença é desenhar como arco, não como fundo.
// Domínio sempre inclui o limite, igual ao eixo Y dos gráficos: a faixa
// alvo fica visível mesmo quando o valor atual está longe dela.
function dominioGauge(valor, limite) {
  if (valor == null && !limite) return null;
  let lo = valor != null ? valor : (limite.min ?? limite.max);
  let hi = valor != null ? valor : (limite.max ?? limite.min);
  if (limite?.min != null) lo = Math.min(lo, limite.min);
  if (limite?.max != null) hi = Math.max(hi, limite.max);
  if (lo === hi) { lo -= 1; hi += 1; }
  const folga = (hi - lo) * 0.15;
  return { min: lo - folga, max: hi + folga };
}
// 180° (esquerda) a 0° (direita) — valor mínimo à esquerda, máximo à direita.
function anguloDoValor(valor, dominio) {
  const frac = Math.min(1, Math.max(0, (valor - dominio.min) / (dominio.max - dominio.min)));
  return 180 - frac * 180;
}
function pontoDoAngulo(cx, cy, r, anguloGraus) {
  const rad = anguloGraus * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function arcoSvgPath(cx, cy, r, anguloInicial, anguloFinal) {
  const p1 = pontoDoAngulo(cx, cy, r, anguloInicial);
  const p2 = pontoDoAngulo(cx, cy, r, anguloFinal);
  const longo = Math.abs(anguloInicial - anguloFinal) > 180 ? 1 : 0;
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${longo} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}
const CORES_FAIXA_GAUGE = { verde: '#16a34a', vermelho: '#dc2626' };
function montarGaugeSvg({ valor, limite, rotulo, unidade }) {
  const W = 160, H = 100, cx = W / 2, cy = 84, r = 62;
  const dominio = dominioGauge(valor, limite);
  const rotuloHtml = `<div class="qai-gauge-rotulo">${esc(rotulo)}</div>
    <div class="qai-gauge-valor">${valor == null ? '—' : esc(fmtValor(valor, unidade))}</div>`;
  if (!dominio) {
    return `<svg viewBox="0 0 ${W} ${H}" class="qai-gauge-svg">
      <path d="${arcoSvgPath(cx, cy, r, 180, 0)}" fill="none" stroke="#e2e8f0" stroke-width="12"/>
    </svg>${rotuloHtml}`;
  }
  const faixas = faixasDoLimite(limite, dominio);
  const trilhas = (faixas.length ? faixas : [{ de: dominio.min, para: dominio.max, cor: null }]).map(f => {
    const a1 = anguloDoValor(f.de, dominio), a2 = anguloDoValor(f.para, dominio);
    const cor = f.cor ? CORES_FAIXA_GAUGE[f.cor] : '#cbd5e1';
    return `<path d="${arcoSvgPath(cx, cy, r, a1, a2)}" fill="none" stroke="${cor}" stroke-width="12"/>`;
  }).join('');
  let agulha = '';
  if (valor != null) {
    const ponta = pontoDoAngulo(cx, cy, r - 16, anguloDoValor(valor, dominio));
    agulha = `<line x1="${cx}" y1="${cy}" x2="${ponta.x.toFixed(2)}" y2="${ponta.y.toFixed(2)}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#0f172a"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="qai-gauge-svg">${trilhas}${agulha}</svg>${rotuloHtml}`;
}
function renderGrandezasKpi(s, codigos, valores, limites) {
  return `<div class="qai-kpis">${codigos.map(c => {
    const i = infoGrandeza(s, c);
    const v = valores[c] ?? null;
    const sit = situacaoGrandeza(v, limites[c]);
    return `<div class="qai-kpi ${sit.classe}">
      <div class="qai-kpi-label">${esc(i.rotulo)}</div>
      <div class="qai-kpi-val">${v == null ? '—' : esc(fmtValor(v, ''))}<span class="qai-kpi-un">${esc(i.unidade)}</span></div>
      <div class="qai-kpi-sub">${esc(sit.texto)} · ${esc(textoLimite(limites[c], i.unidade))}</div>
    </div>`;
  }).join('')}</div>`;
}
function renderGrandezasGauge(s, codigos, valores, limites) {
  return `<div class="qai-gauges">${codigos.map(c => {
    const i = infoGrandeza(s, c);
    const v = valores[c] ?? null;
    return `<div class="qai-gauge-item">${montarGaugeSvg({ valor: v, limite: limites[c] || null, rotulo: i.rotulo, unidade: i.unidade })}</div>`;
  }).join('')}</div>`;
}
function renderDashboard(s) {

        <button class="btn btn-secondary btn-sm" onclick="mudarDia(1)" aria-label="Próximo dia">›</button>
        <span class="qai-sub" id="dash-dia-info" style="margin:0"></span>

// ── Histórico por dia ────────────────────────────────────────────────
// Cada dia é buscado no servidor (desde/ate), para o gráfico não depender
// do limite das últimas leituras. Dia = dia local do navegador.
function diaLocalDe(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function limitesDoDia(dia) {
  const [y, m, d] = dia.split('-').map(Number);
  const ini = new Date(y, m - 1, d).getTime();
  return { desde: ini, ate: ini + 86400000 - 1 };
}
function deslocarDia(dia, n) {
  const [y, m, d] = dia.split('-').map(Number);
  return diaLocalDe(new Date(y, m - 1, d + n).getTime());
}
function escolherDia(dia) {
  if (!dia) return;
  DIA_SELECIONADO = dia;
  carregarDiaDashboard();
}
function mudarDia(n) {
  DIA_SELECIONADO = deslocarDia(DIA_SELECIONADO || diaLocalDe(Date.now()), n);
  const campo = document.getElementById('dash-dia');
  if (campo) campo.value = DIA_SELECIONADO;
  carregarDiaDashboard();
}
async function carregarDiaDashboard() {
  const s = SENSOR_ABERTO;
  if (!s) return;
  if (!DIA_SELECIONADO) DIA_SELECIONADO = LEITURAS_ABERTO[0] ? diaLocalDe(LEITURAS_ABERTO[0].criadoEm) : diaLocalDe(Date.now());
  const req = ++DIA_REQ;
  const { desde, ate } = limitesDoDia(DIA_SELECIONADO);
  const info = document.getElementById('dash-dia-info');
  if (info) info.textContent = 'carregando…';
  try {
    const leituras = await DB.getLeiturasQai(s.id, `?desde=${desde}&ate=${ate}&limite=5000`);
    if (req !== DIA_REQ) return; // resposta de um dia que já não está selecionado
    LEITURAS_DIA = leituras;
    if (info) info.textContent = `${leituras.length} leitura(s)`;
    renderGraficosDashboard(s);
  } catch (e) {
    if (info) info.textContent = '';
    showToast('Não foi possível carregar o dia: ' + e.message, 5000);
  }
}

// ── Gráficos do histórico: grupos de até 2 grandezas ─────────────────
// Escalas e datasets são montados aqui e reutilizados pelo PDF, para que
// os dois mostrem o mesmo tipo de gráfico (eixo esquerdo/direito por unidade).
const ABREV_TIPO = { temperatura: 'Temp', umidade: 'UR', co2: 'CO₂', tvoc: 'TVOC', pm25: 'MP2,5', pm10: 'MP10' };
function abreviacaoGrandeza(sensor, code) {
  const tipo = sensor?.grandezasAtivas?.[code]?.tipo;
  if (tipo && ABREV_TIPO[tipo]) return ABREV_TIPO[tipo];
  const rotulo = infoGrandeza(sensor, code).rotulo;
  return rotulo.length > 10 ? rotulo.slice(0, 10) + '…' : rotulo;
}
function paresDeGrandezas(codigos) {
  const grupos = [];
  for (let i = 0; i < codigos.length; i += 2) grupos.push(codigos.slice(i, i + 2));
  return grupos;
}
// Passo do eixo X: 24h dividido pelas medições do dia (12x → 2h, 2x → 12h).
// Sem horários configurados (modo contínuo), usa 2h.
function passoHoras(sensor) {
  const n = (sensor?.horarios || []).length;
  return n ? 24 / n : 2;
}
function rotuloHora(min) {
  if (min >= 1440) return '24:00';
  const m = ((Math.round(min) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
// Dashboard (um dia): X = minuto do dia.
function pontosDoDia(leituras, codigo) {
  return leituras
    .filter(l => l.valores?.[codigo] != null)
    .map(l => {
      const d = new Date(l.criadoEm);
      return { x: d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60, y: l.valores[codigo] };
    })
    .sort((a, b) => a.x - b.x);
}
// PDF (período): X = instante em ms.
function pontosDoPeriodo(leituras, codigo) {
  return leituras
    .filter(l => l.valores?.[codigo] != null)
    .map(l => ({ x: l.criadoEm, y: l.valores[codigo] }));
}
// Agrupa grandezas ATIVAS pela própria unidade (ex.: duas de °C ficam
// juntas no mesmo eixo) — é isso que faz "Temperatura com Temperatura",
// "% com %" etc. acontecer mesmo quando há mais de uma grandeza por
// unidade. A ordem de primeira aparição é preservada.
function agruparPorUnidade(s, codigos) {
  const mapa = new Map();
  for (const c of codigos) {
    const u = infoGrandeza(s, c).unidade || '';
    if (!mapa.has(u)) mapa.set(u, []);
    mapa.get(u).push(c);
  }
  return [...mapa.entries()].map(([unidade, lista]) => ({ unidade, codigos: lista }));
}
// Monta os grupos de gráfico conforme a preferência de exibição do sensor:
// agrupado (por unidade, até 2 por gráfico) ou individual (1 grandeza por
// gráfico, sempre num eixo só — nunca compartilha eixo com outra).
function montarGrupos(s, codigos, agrupar) {
  if (!agrupar) return codigos.map(c => [{ unidade: infoGrandeza(s, c).unidade, codigos: [c] }]);
  return paresDeGrandezas(agruparPorUnidade(s, codigos));
}
// Limite usado para sombrear o eixo: só faz sentido um único limite por
// eixo. Se o bucket tiver mais de uma grandeza (mesma unidade) com limites
// DIFERENTES entre si, não há uma faixa única pra desenhar — pula a
// sombra nesse eixo em vez de mostrar algo que induziria a erro.
function limiteUniformeDoBucket(s, bucket) {
  const limites = s?.limites || {};
  const vistos = bucket.codigos.map(c => limites[c] || null);
  const primeiro = JSON.stringify(vistos[0] || null);
  return vistos.every(v => JSON.stringify(v || null) === primeiro) ? vistos[0] : null;
}
// Domínio do eixo: SEMPRE inclui a faixa de limites (não só os dados) —
// por isso a margem de segurança e uma excursão acima/abaixo do limite
// ficam visíveis mesmo quando os dados do período não chegam lá.
function dominioYDoBucket(bucket, leituras, pontosFn, limite) {
  const valores = bucket.codigos.flatMap(c => pontosFn(leituras, c).map(p => p.y));
  if (!valores.length && !limite) return null; // nada pra mostrar: deixa o Chart.js decidir
  let lo = valores.length ? Math.min(...valores) : (limite.min ?? limite.max);
  let hi = valores.length ? Math.max(...valores) : (limite.max ?? limite.min);
  if (limite?.min != null) lo = Math.min(lo, limite.min);
  if (limite?.max != null) hi = Math.max(hi, limite.max);
  if (lo === hi) { lo -= 1; hi += 1; }
  const folga = (hi - lo) * 0.1;
  return { min: lo - folga, max: hi + folga };
}
// Verde entre os limites, vermelho fora deles — só a parte que cabe no
// domínio visível do eixo (dominio.min/max já calculado acima).
function faixasDoLimite(limite, dominio) {
  if (!limite || !dominio) return [];
  const { min: dMin, max: dMax } = dominio;
  const faixas = [];
  if (limite.min != null && limite.max != null) {
    faixas.push({ de: limite.min, para: limite.max, cor: 'verde' });
    if (limite.max < dMax) faixas.push({ de: limite.max, para: dMax, cor: 'vermelho' });
    if (limite.min > dMin) faixas.push({ de: dMin, para: limite.min, cor: 'vermelho' });
  } else if (limite.max != null) {
    faixas.push({ de: dMin, para: limite.max, cor: 'verde' });
    if (limite.max < dMax) faixas.push({ de: limite.max, para: dMax, cor: 'vermelho' });
  } else if (limite.min != null) {
    faixas.push({ de: limite.min, para: dMax, cor: 'verde' });
    if (limite.min > dMin) faixas.push({ de: dMin, para: limite.min, cor: 'vermelho' });
  }
  return faixas;
}
// Plugin inline do Chart.js: pinta as faixas atrás das linhas, por eixo
// (y e/ou y1). Usa a própria escala pra converter valor em pixel, então
// acompanha o zoom/autoscale sem recalcular nada aqui.
function pluginFaixaLimites(faixasPorEixo) {
  return {
    id: 'qaiFaixaLimites',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea } = chart;
      Object.entries(faixasPorEixo || {}).forEach(([eixoId, faixas]) => {
        const escala = chart.scales[eixoId];
        if (!escala || !faixas?.length) return;
        faixas.forEach(f => {
          const p1 = escala.getPixelForValue(f.de), p2 = escala.getPixelForValue(f.para);
          const top = Math.min(p1, p2), bottom = Math.max(p1, p2);
          ctx.save();
          ctx.fillStyle = f.cor === 'verde' ? 'rgba(22,163,74,0.12)' : 'rgba(220,38,38,0.12)';
          ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
          ctx.restore();
        });
      });
    },
  };
}
// Escalas de Y do grupo: 1 bucket = 1 eixo. 2 buckets (unidades
// diferentes) = esquerdo + direito. Dentro de um bucket, todas as
// grandezas da mesma unidade compartilham o mesmo eixo.
function escalasYDoGrupo(s, grupo, cores, leituras, pontosFn) {
  const doisEixos = grupo.length === 2;
  const montarEixo = (bucket, pos) => {
    const limite = limiteUniformeDoBucket(s, bucket);
    const dominio = dominioYDoBucket(bucket, leituras, pontosFn, limite);
    const titulo = `${bucket.codigos.map(c => abreviacaoGrandeza(s, c)).join('/')}${bucket.unidade ? ' (' + bucket.unidade + ')' : ''}`;
    const cor = bucket.codigos.length === 1 ? cores.get(bucket.codigos[0]) : '#475569';
    return {
      dominio, faixas: faixasDoLimite(limite, dominio),
      escala: {
        type: 'linear', position: pos, min: dominio?.min, max: dominio?.max,
        title: { display: true, text: titulo, color: cor, font: { size: 10, weight: '600' } },
        ticks: { color: '#475569', font: { size: 10 } },
        grid: pos === 'left' ? { color: '#e2e8f0' } : { drawOnChartArea: false },
      },
    };
  };
  const e0 = montarEixo(grupo[0], 'left');
  const escalas = { y: e0.escala };
  const faixasPorEixo = { y: e0.faixas };
  if (doisEixos) {
    const e1 = montarEixo(grupo[1], 'right');
    escalas.y1 = e1.escala;
    faixasPorEixo.y1 = e1.faixas;
  }
  return { doisEixos, escalas, faixasPorEixo };
}
function datasetsDoGrupo(s, grupo, cores, leituras, pontosFn) {
  const out = [];
  grupo.forEach((bucket, idx) => {
    bucket.codigos.forEach(c => {
      const i = infoGrandeza(s, c);
      out.push({
        label: i.rotulo, unidade: i.unidade, data: pontosFn(leituras, c),
        yAxisID: idx === 1 ? 'y1' : 'y',
        borderColor: cores.get(c), backgroundColor: cores.get(c) + '33',
        tension: .2, pointRadius: 2, showLine: true,
      });
    });
  });
  return out;
}
// Autoscale do X: vai do primeiro ao último ponto, alinhado ao passo.
function dominioAutoX(datasets, passoMin) {
  const xs = datasets.flatMap(d => d.data.map(p => p.x));
  if (!xs.length) return { min: 0, max: 1440 };
  const lo = Math.max(0, Math.floor(Math.min(...xs) / passoMin) * passoMin);
  let hi = Math.min(1440, Math.ceil(Math.max(...xs) / passoMin) * passoMin);
  if (hi <= lo) hi = Math.min(1440, lo + passoMin);
  return { min: lo, max: hi };
}
function opcoesGraficoBase(escalas, tituloTooltip) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: false, axis: 'x' },
    plugins: {
      legend: { labels: { color: '#475569', font: { size: 11 } } },
      tooltip: {
        callbacks: {
          title: tituloTooltip,
          label: it => `${it.dataset.label}: ${fmtValor(it.parsed.y, it.dataset.unidade)}`,
        },
      },
    },
    scales: escalas,
  };
}
function renderGraficosDashboard(s) {
  CHARTS_DASH.forEach(c => c.destroy());
  CHARTS_DASH = [];
  const cont = document.getElementById('dash-graficos');
  if (!cont) return;
  const codigos = Object.keys(s.grandezasAtivas || {});
  if (!codigos.length) {
    cont.innerHTML = '<div class="qai-sub" style="margin:0">Nenhuma grandeza ativa. Escolha as grandezas em ⚙ Configurações.</div>';
    return;
  }
  if (!LEITURAS_DIA.length) {
    cont.innerHTML = '<div class="qai-sub" style="margin:0">Sem leituras neste dia.</div>';
    return;
  }

  const passo = passoHoras(s);
  const cores = coresParaChaves(codigos);
  const grupos = montarGrupos(s, codigos, exibicaoDoSensor(s).agrupar);
  cont.innerHTML = grupos.map((grupo, k) => `
    <div class="qai-grafico-bloco">
      <div class="qai-grafico-titulo">${grupo.flatMap(b => b.codigos).map(c => esc(abreviacaoGrandeza(s, c))).join(' × ')}</div>
      <div class="qai-chart-wrap"><canvas id="ch-dash-${k}"></canvas></div>
    </div>`).join('');

  grupos.forEach((grupo, k) => {
    const ctx = document.getElementById(`ch-dash-${k}`);
    if (!ctx) return;
    const datasets = datasetsDoGrupo(s, grupo, cores, LEITURAS_DIA, pontosDoDia);
    const { escalas, faixasPorEixo } = escalasYDoGrupo(s, grupo, cores, LEITURAS_DIA, pontosDoDia);
    const dom = dominioAutoX(datasets, passo * 60);
    escalas.x = {
      type: 'linear', min: dom.min, max: dom.max,
      ticks: { stepSize: passo * 60, autoSkip: false, color: '#475569', font: { size: 10 }, callback: v => rotuloHora(v) },
      grid: { display: false },
      title: { display: true, text: 'Horário', color: '#475569', font: { size: 10 } },
    };
    CHARTS_DASH.push(new Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: opcoesGraficoBase(escalas, items => items.length ? rotuloHora(items[0].parsed.x) : ''),
      plugins: [pluginFaixaLimites(faixasPorEixo)],
    }));
  });
  const info = document.getElementById('dash-dia-info');
  if (info) info.textContent = `${LEITURAS_DIA.length} leitura(s) · passo ${passo}h`;
}

// ── PDF do sensor — cabeçalho e rodapé no padrão dos demais PDFs do SGM ──
// Mesmo layout de preventiva.html (drawPdfHeader/drawPdfFooters): empresa
// à esquerda, título e metadados à direita, filete cinza, Helvetica 10,
// rodapé com contratante, "Gerado em … por …" e "Página X de Y".
const PDF_M = 20, PDF_W = 210, PDF_H = 297;
const PDF_RODAPE_Y = 270;   // linha do rodapé, igual aos demais PDFs
const PDF_CORPO_MAX = 258;  // limite do corpo acima do rodapé
const PDF_MAX_TABELA = 300; // acima disso a tabela de leituras é omitida (o resumo e os gráficos cobrem o período)

function pdfCabe(doc, y, h) {
  if (y + h > PDF_CORPO_MAX) { doc.addPage(); return 20; }
  return y;
}

function pdfCabecalho(doc, titulo, metaLinhas) {
  let y = 14, textX = PDF_M;
  if (PRESTADORA.logo) {
    const maxW = 24, maxH = 20;
    let w = maxW, h = PRESTADORA.logoRatio ? maxW * parseFloat(PRESTADORA.logoRatio) : maxW * 0.6;
    if (h > maxH) { w = w * (maxH / h); h = maxH; }
    try { doc.addImage(PRESTADORA.logo, 'PNG', PDF_M, y - 2, w, h); textX = PDF_M + w + 6; } catch (e) {}
  }
  const maxTextW = PDF_W - PDF_M - textX - 62;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
  const nomeLinhas = doc.splitTextToSize(PRESTADORA.company || 'Empresa prestadora', maxTextW);
  doc.text(nomeLinhas, textX, y + 2);
  let ly = y + 2 + nomeLinhas.length * 4.5 + 2.5;
  doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 90, 90);
  if (PRESTADORA.address) { const a = doc.splitTextToSize(PRESTADORA.address, maxTextW); doc.text(a, textX, ly); ly += a.length * 4.5; }
  if (PRESTADORA.cnpj) { doc.text(`CNPJ: ${PRESTADORA.cnpj}`, textX, ly); ly += 4.5; }

  doc.setFont('helvetica', 'bold'); doc.setTextColor(20, 20, 20);
  doc.text(titulo, PDF_W - PDF_M, 14, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 90, 90);
  let my = 20;
  metaLinhas.forEach(l => { doc.text(l, PDF_W - PDF_M, my, { align: 'right' }); my += 5.5; });
  doc.setTextColor(0, 0, 0);

  const ruleY = Math.max(ly, my) + 3;
  doc.setDrawColor(220, 220, 220);
  doc.line(PDF_M, ruleY, PDF_W - PDF_M, ruleY);
  return ruleY + 8;
}

function pdfRodapes(doc, contratante) {
  const total = doc.internal.getNumberOfPages();
  const maxW = PDF_W - PDF_M * 2;
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    let fy = PDF_RODAPE_Y;
    doc.setDrawColor(220, 220, 220);
    doc.line(PDF_M, fy, PDF_W - PDF_M, fy);
    fy += 6;
    if (contratante) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(60, 60, 60);
      const linhas = doc.splitTextToSize(contratante, maxW).slice(0, 2);
      doc.text(linhas, PDF_M, fy);
      fy += linhas.length * 4.5 + 1.5;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(140, 140, 140);
    doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')} por ${user?.name || ''}`, PDF_M, fy);
    doc.text(`Página ${i} de ${total}`, PDF_W - PDF_M, fy, { align: 'right' });
    doc.setTextColor(0, 0, 0);
  }
}

// Tabela com cabeçalho repetido em cada página; células com quebra de linha.
function pdfTabela(doc, y, colunas, linhas) {
  const larguraUtil = PDF_W - PDF_M * 2;
  const cabecalho = yy => {
    doc.setFillColor(231, 238, 248);
    doc.rect(PDF_M, yy - 4, larguraUtil, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(20, 20, 20);
    colunas.forEach(c => doc.text(c.titulo, c.x, yy, { align: c.align || 'left' }));
    doc.setFont('helvetica', 'normal'); doc.setTextColor(35, 45, 60);
    return yy + 5;
  };
  y = pdfCabe(doc, y, 14);
  y = cabecalho(y);
  for (const linha of linhas) {
    const celulas = colunas.map((c, i) => doc.splitTextToSize(String(linha[i] ?? '—'), c.largura));
    const altura = Math.max(...celulas.map(l => l.length)) * 4 + 2;
    if (y + altura > PDF_CORPO_MAX) { doc.addPage(); y = cabecalho(20); }
    colunas.forEach((c, i) => doc.text(celulas[i], c.x, y, { align: c.align || 'left' }));
    doc.setDrawColor(225); doc.setLineWidth(0.2);
    doc.line(PDF_M, y + altura - 2, PDF_W - PDF_M, y + altura - 2);
    y += altura;
  }
  doc.setTextColor(0, 0, 0);
  return y + 4;
}

// Mesma técnica de relatorio.html:renderizarGraficoParaImagem — canvas fora
// da tela e bytes PNG (Uint8Array), nunca base64.
async function renderizarGraficoParaImagemQai(config, wPx, hPx) {
  const canvas = document.createElement('canvas');
  canvas.width = wPx; canvas.height = hPx;
  canvas.style.cssText = 'position:fixed;left:-99999px;top:0';
  document.body.appendChild(canvas);
  const chart = new Chart(canvas, { ...config, options: { ...config.options, responsive: false, animation: false } });
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const bytes = new Uint8Array(await blob.arrayBuffer());
  chart.destroy();
  canvas.remove();
  return { bytes, w: wPx, h: hPx };
}

// Resumo de avaliação de uma grandeza no período. null se não houver valores.
function resumoGrandeza(s, codigo, leituras) {
  const vals = leituras.map(l => l.valores?.[codigo]).filter(v => v != null);
  if (!vals.length) return null;
  const avaliadas = leituras.filter(l => {
    const lim = l.limitesNaMedicao?.[codigo];
    return l.valores?.[codigo] != null && lim && (lim.min != null || lim.max != null);
  });
  const fora = avaliadas.filter(l => {
    const lim = l.limitesNaMedicao[codigo], v = l.valores[codigo];
    return (lim.min != null && v < lim.min) || (lim.max != null && v > lim.max);
  }).length;
  return {
    n: vals.length,
    ultimo: vals[vals.length - 1],
    min: Math.min(...vals),
    max: Math.max(...vals),
    media: vals.reduce((a, b) => a + b, 0) / vals.length,
    avaliadas: avaliadas.length,
    pctFora: avaliadas.length ? fora / avaliadas.length : null,
  };
}
function fmtDiaBR(dia) {
  const [y, m, d] = dia.split('-');
  return `${d}/${m}/${y}`;
}
// Tick do eixo de tempo no PDF: hora se o período cabe em 2 dias, senão data.
function rotuloTempoPdf(ms, spanDias) {
  const d = new Date(ms);
  const hora = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  return spanDias <= 2 ? hora : d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0');
}

async function carregarPeriodoQai(id, desde, ate, progresso) {
  const leituras = [];
  let cursor = null;
  do {
    const q = new URLSearchParams({ paginado: '1', limite: '500', desde: String(desde), ate: String(ate) });
    if (cursor) q.set('cursor', cursor);
    const pagina = await DB.getLeiturasQai(id, '?' + q);
    if (!Array.isArray(pagina?.items)) throw new Error('Atualize o servidor para consultar o relatório completo.');
    leituras.push(...pagina.items);
    if (leituras.length > 50000) throw new Error('Período muito extenso. Divida o relatório em períodos menores (máximo 50.000 leituras).');
    if (pagina.nextCursor && pagina.nextCursor === cursor) throw new Error('A paginação não avançou. Tente novamente.');
    cursor = pagina.nextCursor;
    progresso?.(leituras.length);
  } while (cursor);
  return leituras;
}

async function gerarPdfSensor(btn, opcoes) {
  if (!window.jspdf) { showToast('Biblioteca de PDF não carregou. Recarregue a página.'); return; }
  const s = SENSOR_ABERTO;
  if (!s) return;
  const de = opcoes?.de || diaLocalDe(Date.now());
  const ate = opcoes?.ate || de;
  const codigos = (opcoes?.codigos?.length ? opcoes.codigos : Object.keys(s.grandezasAtivas || {}));
  await withActionBusy(btn, 'Gerando…', async () => {
    const { desde } = limitesDoDia(de);
    const { ate: fimPeriodo } = limitesDoDia(ate);
    const buscadas = await carregarPeriodoQai(s.id, desde, fimPeriodo, n => { btn.textContent = `Carregando… ${n} leituras`; });
    // Servidor devolve mais recente primeiro; o PDF é cronológico.
    const leituras = buscadas
      .filter(l => codigos.some(c => l.valores?.[c] != null))
      .reverse();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const contrato = CONTRATOS.find(c => c.numero === s.contrato);
    const contratante = contrato
      ? `Contratante: ${contrato.razao || '—'}   |   Contrato nº ${contrato.numero}   |   ART: ${contrato.art || '—'}`
      : '';
    const CW = PDF_W - PDF_M * 2;
    const cores = coresParaChaves(Object.keys(s.grandezasAtivas || {}));
    const periodoTexto = de === ate ? fmtDiaBR(de) : `${fmtDiaBR(de)} a ${fmtDiaBR(ate)}`;

    let y = pdfCabecalho(doc, 'Qualidade do Ar Interior', [
      `Contrato ${s.contrato}`,
      `Período: ${periodoTexto}`,
      `Emitido em ${new Date().toLocaleString('pt-BR')} por ${user?.name || ''}`,
    ]);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
    doc.text('Avaliação da qualidade do ar interior', PDF_M, y); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setTextColor(50, 50, 50);
    const horarios = s.horarios || [];
    [
      `Estabelecimento: ${s.estabelecimento}`,
      `Recinto: ${s.recinto}`,
      `Janelas de medição: ${horarios.length ? horarios.length + 'x/dia (' + horarios.join(', ') + ')' : 'modo contínuo'}`,
      `Leituras no período: ${leituras.length}`,
      'Resumo: limites vigentes em cada medição; leituras sem limites não são avaliadas.',
      'Faixas dos gráficos: limites atuais, apenas como referência visual.',
    ].forEach(linha => { doc.text(linha, PDF_M, y); y += 5; });
    y += 4;

    if (!leituras.length) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 90, 90);
      doc.text('Nenhuma leitura registrada para as grandezas e o período selecionados.', PDF_M, y);
      y += 8;
    } else {
      // Resumo por grandeza
      y = pdfCabe(doc, y, 20);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
      doc.text('Resumo por grandeza', PDF_M, y); y += 5;
      const linhasResumo = codigos.map(c => {
        const i = infoGrandeza(s, c);
        const r = resumoGrandeza(s, c, leituras);
        if (!r) return [i.rotulo, i.unidade || '—', '—', '—', '—', '—', '—'];
        return [
          i.rotulo, i.unidade || '—',
          fmtValor(r.ultimo, ''), fmtValor(r.min, ''), fmtValor(r.max, ''), fmtValor(r.media, ''),
          r.pctFora == null ? 'sem limite' : `${Math.round(r.pctFora * 100)}%`,
        ];
      });
      y = pdfTabela(doc, y, [
        { titulo: 'Grandeza', x: PDF_M + 2, largura: 44 },
        { titulo: 'Unidade', x: 68, largura: 14 },
        { titulo: 'Último', x: 100, align: 'right', largura: 16 },
        { titulo: 'Mín', x: 116, align: 'right', largura: 14 },
        { titulo: 'Máx', x: 130, align: 'right', largura: 14 },
        { titulo: 'Média', x: 146, align: 'right', largura: 14 },
        { titulo: 'Fora do limite', x: PDF_W - PDF_M - 2, align: 'right', largura: 22 },
      ], linhasResumo);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      for (const c of codigos) {
        const r = resumoGrandeza(s, c, leituras);
        if (!r) continue;
        const texto = `${infoGrandeza(s, c).rotulo}: ${r.avaliadas} de ${r.n} leituras com limites históricos disponíveis.`;
        for (const linha of doc.splitTextToSize(texto, CW)) {
          y = pdfCabe(doc, y, 5); doc.text(linha, PDF_M, y); y += 4.5;
        }
      }

      const limitesTexto = codigos.filter(c => (s.limites || {})[c]).map(c => {
        const i = infoGrandeza(s, c);
        return `Referência atual — ${i.rotulo}: ${textoLimite(s.limites[c], i.unidade)}`;
      });
      if (limitesTexto.length) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 60, 60);
        limitesTexto.forEach(t => { y = pdfCabe(doc, y, 5); doc.text(t, PDF_M, y); y += 4.5; });
        doc.setTextColor(0, 0, 0);
        y += 3;
      }

      // Gráficos: mesma preferência de agrupamento do dashboard, X ajustado ao período
      const grupos = montarGrupos(s, codigos, exibicaoDoSensor(s).agrupar);
      const spanDias = Math.max(1, Math.round((limitesDoDia(ate).ate - limitesDoDia(de).desde) / 86400000));
      y = pdfCabe(doc, y, 20);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
      doc.text('Evolução no período', PDF_M, y); y += 5;
      for (const grupo of grupos) {
        const datasets = datasetsDoGrupo(s, grupo, cores, leituras, pontosDoPeriodo);
        const xs = datasets.flatMap(d => d.data.map(p => p.x));
        if (!xs.length) continue;
        const { escalas, faixasPorEixo } = escalasYDoGrupo(s, grupo, cores, leituras, pontosDoPeriodo);
        escalas.x = {
          type: 'linear', min: Math.min(...xs), max: Math.max(...xs),
          ticks: { maxTicksLimit: 10, color: '#475569', font: { size: 8 }, callback: v => rotuloTempoPdf(v, spanDias) },
          grid: { display: false },
        };
        const config = {
          type: 'line', data: { datasets },
          options: { ...opcoesGraficoBase(escalas, () => ''), plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } },
          plugins: [pluginFaixaLimites(faixasPorEixo)],
        };
        try {
          const img = await renderizarGraficoParaImagemQai(config, 900, 380);
          const imgH = CW * (img.h / img.w);
          y = pdfCabe(doc, y, imgH + 4);
          doc.addImage(img.bytes, 'PNG', PDF_M, y, CW, imgH);
          y += imgH + 6;
        } catch (e) { /* gráfico é complemento; a avaliação numérica continua no PDF */ }
      }

      // Leituras, quando couberem na tabela
      if (leituras.length <= PDF_MAX_TABELA) {
        const linhasHist = leituras.map(l => [
          fmtDataHora(l.criadoEm),
          codigos.filter(c => l.valores?.[c] != null).map(c => `${infoGrandeza(s, c).rotulo}: ${fmtValor(l.valores[c], infoGrandeza(s, c).unidade)}`).join(' · ') || '—',
          l.conforme === true ? 'OK' : l.conforme === false ? 'Fora' : '—',
        ]);
        y = pdfTabela(doc, y, [
          { titulo: 'Data/hora', x: PDF_M + 2, largura: 38 },
          { titulo: 'Valores', x: 62, largura: 110 },
          { titulo: 'Conf.', x: PDF_W - PDF_M - 2, align: 'right', largura: 16 },
        ], linhasHist);
      } else {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
        doc.text(`Tabela de leituras omitida (${leituras.length} registros). Resumo e gráficos cobrem o período.`, PDF_M, y);
        doc.setTextColor(0, 0, 0);
      }
    }

    pdfRodapes(doc, contratante);

    const nome = `qai-${s.estabelecimento}-${s.recinto}-${de}_${ate}.pdf`.replace(/[^\w.-]+/g, '_');
    try { doc.save(nome); showToast('✅ ' + nome); }
    catch (e) { showToast('Erro ao gerar o PDF: ' + e.message, 6000); }
  });
}

iniciarQai();
</script>
