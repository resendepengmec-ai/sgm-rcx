<div id="toast" class="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// QAI — Qualidade do Ar Interior
// ══════════════════════════════════════════════════════════════════
// Sem leitura manual. Grandezas são genéricas: a tela mostra o que o
// dispositivo realmente reporta (grandezasDisponiveis), e o admin escolhe
// quais medir e armazenar. Rótulo, unidade e cor vêm do próprio sensor,
// nunca de uma lista fixa de tipos.

const REGIOES_TUYA = { us: 'Américas (us)', eu: 'Europa (eu)', cn: 'China (cn)', in: 'Índia (in)' };
const FREQUENCIAS = [0, 1, 2, 3, 4, 6, 12];

let user = null;
let CONTRATOS = [];
let LINHAS = [];            // dashboard do contrato selecionado
let SENSOR_ABERTO = null;   // sensor completo exibido no modal
let LEITURAS_ABERTO = [];
let CHART_LEITURAS = null;
let LOCAIS = [];             // estabelecimentos/recintos do contrato (autocomplete)
let LOCAIS_CONTRATO = null;  // contrato a que LOCAIS pertence
let DISPONIVEIS_RENDER = []; // ordem das linhas de grandezas, lida no salvar
let LIMITES_RENDER = [];     // ordem das linhas de limites, lida no salvar

function showToast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }

// ── Cores: hash FNV-1a → paleta; colisões resolvidas por probing linear
// sobre a lista ORDENADA de códigos do gráfico — mesma entrada, mesma cor.
const PALETA_COR = ['#7c3aed', '#0891b2', '#059669', '#d97706', '#dc2626', '#2563eb',
  '#db2777', '#65a30d', '#9333ea', '#0d9488', '#ea580c', '#4338ca'];
function _hashFnv1a(chave) {
  const s = String(chave);
  let hash = 2166136261;
  for (let i = 0; i < s.length; i++) { hash ^= s.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return hash;
}
function coresParaChaves(chaves) {
  const usados = new Set();
  const mapa = new Map();
  for (const chave of [...chaves].sort()) {
    let idx = Math.abs(_hashFnv1a(chave)) % PALETA_COR.length;
    while (usados.has(idx)) idx = (idx + 1) % PALETA_COR.length;
    usados.add(idx);
    mapa.set(chave, PALETA_COR[idx]);
  }
  return mapa;
}

// ── Distribuição automática de horários (espelho de qai-schedule.js:
// distribuirHorarios, só para preencher o formulário; o servidor valida).
function distribuirHorariosLocal(x, primeiroHorario) {
  const [hh, mm] = String(primeiroHorario || '00:00').split(':').map(Number);
  const inicio = (hh || 0) * 60 + (mm || 0);
  const passo = 1440 / x;
  const out = [];
  for (let i = 0; i < x; i++) {
    let m = Math.round(inicio + i * passo);
    m = ((m % 1440) + 1440) % 1440;
    out.push(String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'));
  }
  return out;
}

function fmtDataHora(ts) { return ts ? new Date(ts).toLocaleString('pt-BR') : '—'; }
function fmtValor(valor, unidade) {
  if (valor == null) return '—';
  return String(Math.round(valor * 1000) / 1000) + (unidade ? ' ' + unidade : '');
}
function tempoRelativo(ts) {
  if (!ts) return '—';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}

// ── Locais do contrato (autocomplete do cadastro) ──────────────────
// Sugestões vêm dos equipamentos já cadastrados no contrato. O campo
// continua aceitando texto livre, para um local que ainda não tem
// equipamento; a sugestão só evita grafias diferentes do mesmo lugar.
function _normTexto(v) { return String(v || '').trim().toLocaleLowerCase('pt-BR'); }
function recintosDe(locais, estabelecimento) {
  const alvo = _normTexto(estabelecimento);
  const achado = (locais || []).find(l => _normTexto(l.estabelecimento) === alvo);
  return achado ? achado.recintos : [];
}
async function carregarLocais(contrato) {
  if (!contrato) { LOCAIS = []; LOCAIS_CONTRATO = null; return; }
  if (LOCAIS_CONTRATO === contrato) return;
  try {
    LOCAIS = await DB.getLocaisQai(contrato);
    LOCAIS_CONTRATO = contrato;
  } catch (e) {
    LOCAIS = []; LOCAIS_CONTRATO = null;
    showToast('Não foi possível carregar os locais do contrato: ' + e.message, 5000);
  }
}
function atualizarDatalistRecinto(idRecinto, estabelecimento) {
  document.getElementById(idRecinto).innerHTML =
    recintosDe(LOCAIS, estabelecimento).map(r => `<option value="${esc(r)}"></option>`).join('');
}
function preencherDatalists(idEstab, idRecinto, estabelecimentoAtual) {
  document.getElementById(idEstab).innerHTML =
    LOCAIS.map(l => `<option value="${esc(l.estabelecimento)}"></option>`).join('');
  atualizarDatalistRecinto(idRecinto, estabelecimentoAtual);
}

// Rótulo e unidade de um data point, a partir do próprio sensor.
function infoGrandeza(sensor, code) {
  const a = sensor?.grandezasAtivas?.[code];
  if (a) return { rotulo: a.rotulo || code, unidade: a.unidade || '' };
  const d = (sensor?.grandezasDisponiveis || []).find(x => x.code === code);
  if (d) return { rotulo: d.rotulo || code, unidade: d.unidade || '' };
  return { rotulo: code, unidade: '' };
}
function codigosDe(valores) { return Object.keys(valores || {}).sort(); }

// ── Início ───────────────────────────────────────────────────────────
async function iniciarQai() {
  const confirmado = await guardaDeModulo('qai');
  if (!confirmado) return;
  user = confirmado;
  document.getElementById('auth-overlay').style.display = 'none';
  try {
    CONTRATOS = await DB.getContratos();
  } catch (e) {
    CONTRATOS = [];
    showToast('Não foi possível carregar os contratos: ' + e.message, 6000);
  }
  preencherSelectContratos();
}

function preencherSelectContratos() {
  const sel = document.getElementById('f-contrato');
  const userContract = user?.contract;
  const visiveis = userContract
    ? CONTRATOS.filter(c => String(userContract).split(',').map(s => s.trim()).includes(c.numero))
    : CONTRATOS;
  sel.innerHTML = '<option value="">Selecione o contrato…</option>' +
    visiveis.map(c => `<option value="${esc(c.numero)}">${esc(c.numero)} — ${esc(c.razao || '')}</option>`).join('');
}

function aoTrocarContrato() {
  const contrato = document.getElementById('f-contrato').value;
  document.getElementById('btn-novo-sensor').disabled = !contrato;
  if (!contrato) {
    LINHAS = [];
    document.getElementById('qai-lista').innerHTML = '<div class="empty">Selecione um contrato para ver os sensores.</div>';
    return;
  }
  carregarLista();
}

// ── Lista / dashboard ────────────────────────────────────────────────
async function carregarLista() {
  const contrato = document.getElementById('f-contrato').value;
  if (!contrato) return;
  const lista = document.getElementById('qai-lista');
  lista.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    LINHAS = await DB.getDashboardQai(contrato);
    renderLista();
  } catch (e) {
    lista.innerHTML = '<div class="empty">Não foi possível carregar os sensores.</div>';
    showToast('Erro ao carregar sensores: ' + e.message, 6000);
  }
}

function renderLista() {
  const lista = document.getElementById('qai-lista');
  if (!LINHAS.length) {
    lista.innerHTML = '<div class="empty">Nenhum sensor cadastrado neste contrato ainda.<br>Use "+ Novo sensor" para começar.</div>';
    return;
  }
  lista.innerHTML = LINHAS.map(renderCard).join('');
}

function renderCard(linha) {
  const s = linha.sensor;
  const tel = linha.telemetriaAoVivo;
  const leitura = linha.ultimaLeitura;
  const valores = tel ? tel.valores : (leitura ? leitura.valores : {});
  const conforme = tel ? tel.conforme : (leitura ? leitura.conforme : null);
  const quando = tel ? tel.recebidoEm : (leitura ? leitura.criadoEm : null);

  const badgeConforme = conforme === true ? '<span class="badge conforme">✓ Conforme</span>'
    : conforme === false ? '<span class="badge fora">⚠ Fora do limite</span>'
    : '<span class="badge semlimite">sem limite</span>';

  const chips = codigosDe(valores).map(c => {
    const i = infoGrandeza(s, c);
    return `<span class="qai-valor">${esc(i.rotulo)}: ${fmtValor(valores[c], i.unidade)}</span>`;
  }).join('');

  return `<div class="qai-card ${s.sensorAtivo ? 'ativo' : 'inativo'}" onclick="abrirSensor('${s.id}')">
    <div class="qai-card-top">
      <div>
        <div class="qai-card-titulo">${esc(s.estabelecimento)} · ${esc(s.recinto)}</div>
        <div class="qai-card-sub">${s.sensorAtivo ? '<span class="badge ativo">Ativo</span>' : '<span class="badge inativo">Inativo</span>'} ${quando ? badgeConforme : ''}</div>
      </div>
    </div>
    <div class="qai-card-valores">${chips || '<span class="qai-valor">sem leitura ainda</span>'}</div>
    <div class="qai-card-rodape">${quando ? 'Última leitura: ' + tempoRelativo(quando) : 'Nunca sincronizado'}</div>
  </div>`;
}

// ── Novo sensor ──────────────────────────────────────────────────────
async function abrirNovoSensor() {
  const contrato = document.getElementById('f-contrato').value;
  await carregarLocais(contrato);
  document.getElementById('novo-estabelecimento').value = '';
  document.getElementById('novo-recinto').value = '';
  preencherDatalists('dl-estab-novo', 'dl-recinto-novo', '');
  abrirModal('modal-novo');
}

async function salvarNovoSensor(btn) {
  const contrato = document.getElementById('f-contrato').value;
  const estabelecimento = document.getElementById('novo-estabelecimento').value.trim();
  const recinto = document.getElementById('novo-recinto').value.trim();
  if (!estabelecimento || !recinto) { showToast('Informe estabelecimento e recinto.'); return; }
  await withActionBusy(btn, 'Criando…', async () => {
    try {
      const sensor = await DB.saveSensorQai({ contrato, estabelecimento, recinto });
      fecharModal('modal-novo');
      showToast('Sensor criado — configure as credenciais Tuya a seguir.');
      await carregarLista();
      abrirSensor(sensor.id);
    } catch (e) {
      showToast('Erro ao criar sensor: ' + e.message, 6000);
    }
  });
}

// ── Detalhe/configuração do sensor ──────────────────────────────────
async function abrirSensor(id) {
  abrirModal('modal-sensor');
  document.getElementById('sensor-modal-conteudo').innerHTML = 'Carregando…';
  try {
    const [sensor, leituras, aparelhos] = await Promise.all([
      DB.getSensorQai(id), DB.getLeiturasQai(id, '?limite=50'), DB.getAparelhosQai(id),
    ]);
    SENSOR_ABERTO = sensor;
    LEITURAS_ABERTO = leituras;
    await carregarLocais(sensor.contrato);
    renderModalSensor(aparelhos);
  } catch (e) {
    document.getElementById('sensor-modal-conteudo').innerHTML =
      `<div class="empty">Não foi possível carregar o sensor: ${esc(e.message)}</div>`;
  }
}

function renderModalSensor(aparelhos) {
  const s = SENSOR_ABERTO;
  if (!s) return;
  const el = document.getElementById('sensor-modal-conteudo');
  el.innerHTML = `
    <div class="modal-title">${esc(s.estabelecimento)} · ${esc(s.recinto)}</div>
    <div id="sec-acoes"></div>
    <div id="sec-basico"></div>
    <div id="sec-credenciais"></div>
    <div id="sec-grandezas"></div>
    <div id="sec-limites"></div>
    <div id="sec-horarios"></div>
    <div id="sec-leituras"></div>
    <div id="sec-aparelhos"></div>
  `;
  renderAcoes(s);
  renderBasico(s);
  renderCredenciais(s);
  renderGrandezas(s);
  renderLimites(s);
  renderHorarios(s);
  renderLeituras(LEITURAS_ABERTO);
  renderAparelhos(aparelhos || []);
}

// PATCH com _version (lock otimista). Em conflito, recarrega o sensor.
async function patchSensorAtual(dados, mensagemOk) {
  try {
    const atualizado = await DB.updateSensorQai(SENSOR_ABERTO.id, { ...dados, _version: SENSOR_ABERTO._version });
    SENSOR_ABERTO = atualizado;
    renderModalSensor();
    carregarLista();
    if (mensagemOk) showToast(mensagemOk);
    return atualizado;
  } catch (e) {
    if (e.code === 'VERSION_CONFLICT') {
      showToast('Este sensor foi alterado em outro envio — recarregando dados atuais…', 5000);
      await abrirSensor(SENSOR_ABERTO.id);
    } else {
      showToast('Erro: ' + e.message, 6000);
    }
    throw e;
  }
}

// ── Ações: ativar/desativar/sincronizar/excluir ─────────────────────
function renderAcoes(s) {
  document.getElementById('sec-acoes').innerHTML = `
    <div class="card">
      <div class="action-bar" style="flex-wrap:wrap;margin-top:0">
        ${s.sensorAtivo
          ? `<button class="btn btn-secondary btn-sm" style="flex:1" onclick="desativarSensorAtual(this)">⏸ Desativar</button>`
          : `<button class="btn btn-primary btn-sm" style="flex:1" onclick="ativarSensorAtual(this)">▶ Ativar</button>`}
        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="sincronizarSensorAtual(this)">↻ Sincronizar agora</button>
        <button class="btn btn-danger btn-sm" style="flex:1" onclick="excluirSensorAtual(this)">🗑 Excluir</button>
      </div>
      <div class="qai-sub" style="margin-top:8px;margin-bottom:0">
        ${s.ultimoTesteOk ? 'Último teste de conexão OK: ' + fmtDataHora(s.ultimoTesteOk) : 'Conexão nunca testada.'}
      </div>
    </div>`;
}

async function ativarSensorAtual(btn) {
  await withActionBusy(btn, 'Testando conexão…', async () => {
    try {
      const resultado = await DB.ativarSensorQai(SENSOR_ABERTO.id);
      SENSOR_ABERTO = resultado.sensor;
      const orfas = resultado.teste?.grandezasOrfas;
      showToast(orfas?.length
        ? `Sensor ativado. Atenção: data point(s) ${orfas.join(', ')} não existem mais neste dispositivo e foram removidos da coleta.`
        : 'Sensor ativado.', orfas?.length ? 8000 : 3000);
      renderModalSensor();
      carregarLista();
    } catch (e) { showToast('Não foi possível ativar: ' + e.message, 7000); }
  });
}
async function desativarSensorAtual(btn) {
  await withActionBusy(btn, 'Desativando…', async () => {
    try {
      const resultado = await DB.desativarSensorQai(SENSOR_ABERTO.id);
      SENSOR_ABERTO = resultado.sensor;
      showToast('Sensor desativado.');
      renderModalSensor();
      carregarLista();
    } catch (e) { showToast('Erro: ' + e.message, 6000); }
  });
}
async function sincronizarSensorAtual(btn) {
  await withActionBusy(btn, 'Sincronizando…', async () => {
    try {
      const resultado = await DB.sincronizarSensorQai(SENSOR_ABERTO.id);
      if (resultado.formal) showToast('✅ Leitura registrada.');
      else if (resultado.motivo === 'janela_ocupada') showToast('Leitura obtida, mas a janela de medição de hoje já estava preenchida.', 6000);
      else if (resultado.motivo === 'sem_dados') showToast('O dispositivo não reportou nenhum data point ativo.', 6000);
      else showToast('Leitura obtida (sem registro formal).', 6000);
      LEITURAS_ABERTO = await DB.getLeiturasQai(SENSOR_ABERTO.id, '?limite=50');
      renderLeituras(LEITURAS_ABERTO);
      carregarLista();
    } catch (e) { showToast('Erro ao sincronizar: ' + e.message, 7000); }
  });
}
async function excluirSensorAtual(btn) {
  if (!confirm('Excluir este sensor? O histórico de leituras é mantido, mas o sensor sai da lista ativa.')) return;
  await withActionBusy(btn, 'Excluindo…', async () => {
    try {
      await DB.deleteSensorQai(SENSOR_ABERTO.id);
      showToast('Sensor excluído.');
      fecharModal('modal-sensor');
      SENSOR_ABERTO = null;
      carregarLista();
    } catch (e) { showToast('Erro ao excluir: ' + e.message, 6000); }
  });
}

// ── PDF do sensor ────────────────────────────────────────────────────
const QPDF_M = 15, QPDF_W = 210, QPDF_H = 297;
function qaiCabe(doc, y, h) { return (y + h > QPDF_H - QPDF_M) ? (doc.addPage(), QPDF_M) : y; }

// Captura de gráfico em PNG (mesma técnica de relatorio.html).
async function renderizarGraficoParaImagemQai(config, wPx, hPx) {
  const canvas = document.createElement('canvas');
  canvas.width = wPx; canvas.height = hPx;
  canvas.style.cssText = 'position:fixed;left:-99999px;top:0';
  document.body.appendChild(canvas);
  const chart = new Chart(canvas, { ...config, options: { ...config.options, responsive: false, animation: false } });
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const bytes = new Uint8Array(await blob.arrayBuffer());
  chart.destroy();
  canvas.remove();
  return { bytes, w: wPx, h: hPx };
}

async function gerarPdfSensor(btn) {
  if (!window.jspdf) { showToast('Biblioteca de PDF não carregou. Recarregue a página.'); return; }
  const s = SENSOR_ABERTO;
  if (!s) return;
  await withActionBusy(btn, 'Gerando…', async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const CW = QPDF_W - QPDF_M * 2;
    let y = QPDF_M;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('RELATÓRIO QAI — QUALIDADE DO AR INTERIOR', QPDF_M, y); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(`Contrato ${s.contrato} · ${s.estabelecimento} · ${s.recinto}`, QPDF_M, y); y += 5;
    doc.setFontSize(9); doc.setTextColor(90);
    doc.text(`Status: ${s.sensorAtivo ? 'Ativo' : 'Inativo'} · Emitido em ${new Date().toLocaleString('pt-BR')} por ${user?.name || ''}`, QPDF_M, y); y += 4;
    doc.setTextColor(0);
    doc.setDrawColor(180); doc.setLineWidth(0.3);
    doc.line(QPDF_M, y, QPDF_W - QPDF_M, y); y += 7;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Limites de conformidade', QPDF_M, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const limitesCodigos = Object.keys(s.limites || {}).sort();
    const limitesTexto = limitesCodigos.map(c => {
      const l = s.limites[c], i = infoGrandeza(s, c);
      const partes = [];
      if (l.min != null) partes.push(`mín ${l.min}${i.unidade ? ' ' + i.unidade : ''}`);
      if (l.max != null) partes.push(`máx ${l.max}${i.unidade ? ' ' + i.unidade : ''}`);
      return `${i.rotulo}: ${partes.join(' / ')}`;
    });
    if (!limitesTexto.length) { doc.text('Nenhum limite configurado.', QPDF_M, y); y += 6; }
    else { limitesTexto.forEach(t => { doc.text(t, QPDF_M, y); y += 5; }); }
    y += 2;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Janelas de medição', QPDF_M, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text(s.horarios?.length ? `${s.horarios.length}x/dia — ${s.horarios.join(', ')}` : 'Modo contínuo (toda leitura válida é registrada).', QPDF_M, y);
    y += 9;

    if (LEITURAS_ABERTO.length) {
      y = qaiCabe(doc, y, 80);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      doc.text('Histórico de leituras', QPDF_M, y); y += 5;
      const cronologica = [...LEITURAS_ABERTO].reverse();
      const codigos = [...new Set(cronologica.flatMap(l => Object.keys(l.valores || {})))].sort();
      const cores = coresParaChaves(codigos);
      const config = {
        type: 'line',
        data: {
          labels: cronologica.map(l => new Date(l.criadoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })),
          datasets: codigos.map(c => ({
            label: infoGrandeza(s, c).rotulo, data: cronologica.map(l => l.valores?.[c] ?? null),
            borderColor: cores.get(c), backgroundColor: cores.get(c) + '33', spanGaps: true, tension: .25, pointRadius: 1,
          })),
        },
        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } },
          scales: { x: { ticks: { font: { size: 7 } } }, y: { ticks: { font: { size: 8 } } } } },
      };
      try {
        const img = await renderizarGraficoParaImagemQai(config, 900, 420);
        const imgH = CW * (img.h / img.w);
        doc.addImage(img.bytes, 'PNG', QPDF_M, y, CW, imgH);
        y += imgH + 8;
      } catch (e) { /* gráfico é complemento visual — segue sem ele se falhar */ }
    }

    y = qaiCabe(doc, y, 14);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Leituras (mais recentes primeiro)', QPDF_M, y); y += 6;
    doc.setFillColor(231, 238, 248);
    doc.rect(QPDF_M, y - 4, CW, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
    doc.text('Quando', QPDF_M + 2, y);
    doc.text('Valores', QPDF_M + 42, y);
    doc.text('Conf.', QPDF_W - QPDF_M - 2, y, { align: 'right' });
    y += 5;
    doc.setFont('helvetica', 'normal');
    LEITURAS_ABERTO.forEach(l => {
      y = qaiCabe(doc, y, 6);
      doc.setFontSize(8);
      doc.text(fmtDataHora(l.criadoEm), QPDF_M + 2, y);
      const valores = codigosDe(l.valores).map(c => {
        const i = infoGrandeza(s, c);
        return `${i.rotulo}: ${fmtValor(l.valores[c], i.unidade)}`;
      }).join(' · ');
      doc.text(doc.splitTextToSize(valores || '—', CW - 70)[0], QPDF_M + 42, y);
      doc.text(l.conforme === true ? 'OK' : l.conforme === false ? 'FORA' : '—', QPDF_W - QPDF_M - 2, y, { align: 'right' });
      doc.setDrawColor(225); doc.setLineWidth(0.2);
      doc.line(QPDF_M, y + 2, QPDF_W - QPDF_M, y + 2);
      y += 5;
    });

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
      doc.text(`Página ${i} de ${pageCount}`, QPDF_W - QPDF_M, QPDF_H - 10, { align: 'right' });
      doc.setTextColor(0);
    }

    const nome = `qai-${s.estabelecimento}-${s.recinto}-${new Date().toISOString().slice(0, 10)}.pdf`.replace(/[^\w.-]+/g, '_');
    try { doc.save(nome); showToast('✅ ' + nome); }
    catch (e) { showToast('Erro ao gerar o PDF: ' + e.message, 6000); }
  });
}

iniciarQai();
</script>
</body>
</html>
