<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <!-- ══ V17: Content Security Policy ══════════════════════════════
       O GitHub Pages é estático e não define cabeçalhos HTTP, então o CSP
       precisa vir por <meta>. Limitações honestas desta política:

       • 'unsafe-inline' em script-src é INEVITÁVEL hoje: todo o JavaScript
         do sistema está em blocos de script inline. Com ele, o CSP NAO
         bloqueia o XSS de V03/V11 — a correção daquilo é a sanitização no
         servidor + o escape no cliente, já aplicados.
       • O que este CSP DE FATO entrega: connect-src restringe para onde os
         dados podem ser enviados, o que impede a exfiltração do token para
         um domínio do atacante mesmo que um XSS ocorra; frame-ancestors
         bloqueia clickjacking; base-uri e form-action fecham desvios.

       Remover 'unsafe-inline' exige extrair ~10.000 linhas de script
       inline para arquivos externos — projeto de médio prazo. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com;
    connect-src 'self' https://smm-backend-a8a4.onrender.com https://nominatim.openstreetmap.org https://oauth2.googleapis.com https://www.googleapis.com;
    font-src 'self' data:;
    frame-ancestors 'none';
    base-uri 'none';
    form-action 'none';
    object-src 'none';
    upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autenticando…</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f6fa;}
.card{text-align:center;background:#fff;padding:40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);max-width:320px;}
.spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
h2{font-size:16px;color:#0f172a;margin-bottom:8px;}
p{font-size:13px;color:#94a3b8;}
.error{color:#dc2626;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="msg">Autenticando com Google…</h2>
  <p id="sub">Aguarde um momento</p>
</div>
<script src="config.js"></script>
<script src="api-client.js"></script>
<script>
(async () => {
  // Support both implicit flow (access_token in hash) and
  // authorization code flow (code in query params)
  const hash   = location.hash.slice(1);
  const query  = location.search.slice(1);
  const hParams = Object.fromEntries(new URLSearchParams(hash));
  const qParams = Object.fromEntries(new URLSearchParams(query));

  const token = hParams.access_token || qParams.access_token;

  if (!token) {
    const error = hParams.error || qParams.error || 'Token não encontrado';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Erro na autenticação';
    document.getElementById('msg').className = 'error';
    document.getElementById('sub').textContent = error + '. Tente novamente.';
    setTimeout(() => window.location.href = 'index.html', 3000);
    return;
  }

  try {
    document.getElementById('msg').textContent = 'Verificando perfil…';
    const user = await loginWithGoogleToken(token);
    document.getElementById('msg').textContent = 'Bem-vindo, ' + user.name.split(' ')[0] + '!';
    document.getElementById('sub').textContent = 'Redirecionando…';
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Acesso negado';
    document.getElementById('msg').className = 'error';
    document.getElementById('sub').textContent = e.message;
    setTimeout(() => window.location.href = 'index.html', 4000);
  }
})();
</script>
</body>
</html>
