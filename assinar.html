<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <!-- ══ V17: Content Security Policy ══════════════════════════════
       O GitHub Pages é estático e não define cabeçalhos HTTP, então o CSP
       precisa vir por <meta>. Limitações honestas desta política:

       • 'unsafe-inline' em script-src é INEVITÁVEL hoje: todo o JavaScript
         do sistema está em blocos de script inline. Com ele, o CSP NAO
         bloqueia o XSS de V03/V11 — a correção daquilo é a sanitização no
         servidor + o escape no cliente, já aplicados.
       • O que este CSP DE FATO entrega: connect-src restringe para onde os
         dados podem ser enviados, o que impede a exfiltração do token para
         um domínio do atacante mesmo que um XSS ocorra; frame-ancestors
         bloqueia clickjacking; base-uri e form-action fecham desvios.

       Remover 'unsafe-inline' exige extrair ~10.000 linhas de script
       inline para arquivos externos — projeto de médio prazo. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com;
    connect-src 'self' https://smm-backend-a8a4.onrender.com https://nominatim.openstreetmap.org https://oauth2.googleapis.com https://www.googleapis.com;
    font-src 'self' data:;
    frame-ancestors 'none';
    base-uri 'none';
    form-action 'none';
    object-src 'none';
    upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0369a1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Assinatura de recebimento — SGM</title>
<script src="config.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  body{ background:var(--bg); padding:0 0 40px; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 14px; }
  .topbar{ background:#0369a1; color:#fff; padding:16px 14px; text-align:center; }
  .topbar .t{ font-size:16px; font-weight:700; }
  .topbar .s{ font-size:12px; opacity:.9; margin-top:2px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:14px; }
  .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-3); font-weight:700; }
  .os{ border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:8px; }
  .os h4{ margin:0 0 4px; font-size:14px; }
  .os .meta{ font-size:12px; color:var(--text-2); }
  .svc{ font-size:13px; color:var(--text); margin-top:4px; }
  .svc li{ margin-left:16px; }
  .consent{ display:flex; gap:10px; align-items:flex-start; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:14px; cursor:pointer; }
  .consent input{ width:22px; height:22px; margin-top:1px; flex-shrink:0; }
  .btn{ width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:14px; }
  .btn-primary{ background:#0369a1; color:#fff; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .msg{ text-align:center; padding:40px 14px; }
  .msg .ico{ font-size:44px; }
  .msg h2{ margin:12px 0 6px; }
  .msg p{ color:var(--text-2); font-size:14px; line-height:1.5; }
  .priv{ font-size:11px; color:var(--text-3); text-align:center; margin-top:16px; line-height:1.5; }
  .spin{ text-align:center; padding:60px 0; color:var(--text-3); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="t">Recebimento de serviço</div>
    <div class="s">Assinatura do responsável do estabelecimento</div>
  </div>
  <div class="wrap" id="root">
    <div class="spin">Carregando…</div>
  </div>

<script>
(function(){
  'use strict';
  var API = (window.SMM_API || 'https://smm-backend-a8a4.onrender.com');
  var root = document.getElementById('root');
  var token = new URLSearchParams(location.search).get('t') || '';
  var data = null;   // resposta do GET
  var geo  = null;   // geolocalização opcional

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmtData(d){ if(!d) return '—'; try{ if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4); var x=new Date(d); return x.toLocaleString('pt-BR'); }catch(e){ return String(d); } }

  function erro(titulo, sub){
    root.innerHTML = '<div class="msg"><div class="ico">⚠️</div><h2>'+esc(titulo)+'</h2><p>'+esc(sub||'')+'</p></div>';
  }

  function pedirGeo(){
    if(!navigator.geolocation) return;
    try{ navigator.geolocation.getCurrentPosition(function(p){
      geo = { lat:p.coords.latitude, lng:p.coords.longitude, precisao:p.coords.accuracy };
    }, function(){}, { enableHighAccuracy:false, timeout:6000, maximumAge:0 }); }catch(e){}
  }

  function render(){
    var s = data.snapshot || {};
    var ordens = Array.isArray(s.ordens) ? s.ordens : [];
    var ordensHtml = ordens.length ? ordens.map(function(o){
      var svcs = Array.isArray(o.servicos) ? o.servicos : [];
      return '<div class="os"><h4>O.S. '+esc(o.numero||'—')+(o.tag?' · TAG '+esc(o.tag):'')+'</h4>'
        + '<div class="meta">'+ (o.data?('Execução: '+esc(fmtData(o.data))) : '') +'</div>'
        + (svcs.length ? '<ul class="svc">'+svcs.map(function(x){return '<li>'+esc(typeof x==='string'?x:(x&&x.name||x))+'</li>';}).join('')+'</ul>' : '<div class="svc" style="color:var(--text-3)">Sem serviços listados</div>')
        + (o.observacoes ? '<div class="meta" style="margin-top:6px"><em>Obs.: '+esc(o.observacoes)+'</em></div>' : '')
        + '</div>';
    }).join('') : '<div style="color:var(--text-3);font-size:13px">Nenhuma O.S. no resumo.</div>';

    root.innerHTML =
      '<div class="card">'
      + '<div class="lbl">Estabelecimento</div>'
      + '<div style="font-size:16px;font-weight:700;margin:2px 0 8px">'+esc(data.establishment||'—')+'</div>'
      + (s.contratante ? '<div class="meta" style="font-size:12px;color:var(--text-2)">'+esc(s.contratante)+'</div>' : '')
      + '<div class="meta" style="font-size:12px;color:var(--text-2)">Contrato '+esc(data.contract||'—')+ (s.tecnico?(' · Técnico: '+esc(s.tecnico)):'') +'</div>'
      + '</div>'
      + '<div class="card"><div class="lbl" style="margin-bottom:6px">Serviços a receber ('+ordens.length+')</div>'+ordensHtml+'</div>'
      + '<label class="consent"><input type="checkbox" id="aceite" onchange="__setAceite(this.checked)">'
      +   '<span style="font-size:13px;line-height:1.5">Eu, <strong>'+esc(data.responsavelNome||'responsável')+'</strong>, declaro que <strong>recebi</strong> e <strong>atesto a execução</strong> dos serviços descritos neste resumo.</span></label>'
      + '<button class="btn btn-primary" id="btn" disabled onclick="__assinar()">Confirmar recebimento e assinar</button>'
      + '<div class="priv">Ao assinar, registramos data, hora e localização aproximada para comprovação. Os dados são usados apenas para o comprovante de recebimento do serviço.</div>';
    pedirGeo();
  }

  window.__setAceite = function(v){ var b=document.getElementById('btn'); if(b) b.disabled=!v; };

  window.__assinar = function(){
    var btn = document.getElementById('btn');
    if(!document.getElementById('aceite').checked){ return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    fetch(API+'/api/assinatura-cliente/t/'+encodeURIComponent(token)+'/assinar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ aceite:true, geo:geo })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok || !res.j.ok){ throw new Error((res.j&&res.j.error) || 'Falha ao assinar'); }
      var em = res.j.data && res.j.data.em ? new Date(res.j.data.em).toLocaleString('pt-BR') : new Date().toLocaleString('pt-BR');
      root.innerHTML = '<div class="msg"><div class="ico">✅</div><h2>Recebimento assinado!</h2>'
        + '<p>Obrigado, '+esc(data.responsavelNome||'')+'.<br>Registrado em '+esc(em)+'.</p>'
        + '<p style="margin-top:10px;font-size:13px">A empresa foi notificada. Você já pode fechar esta página.</p></div>';
    }).catch(function(e){
      btn.disabled=false; btn.textContent='Confirmar recebimento e assinar';
      alert('Não foi possível assinar: '+(e.message||e));
    });
  };

  // ── início ──
  if(!token){ erro('Link inválido', 'Este endereço não contém um código de assinatura.'); return; }
  fetch(API+'/api/assinatura-cliente/t/'+encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(res){
      if(res.status===410){ erro('Link não disponível', (res.j&&res.j.error) || 'Este link já foi usado ou expirou.'); return; }
      if(!res.j || !res.j.ok){ erro('Link inválido', (res.j&&res.j.error) || 'Não foi possível abrir esta assinatura.'); return; }
      data = res.j.data;
      render();
    }).catch(function(e){
      erro('Sem conexão', 'Não foi possível carregar. Verifique a internet e tente de novo.');
    });
})();
</script>
</body>
</html>
